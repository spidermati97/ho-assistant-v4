      case 'img-edit': { const im = (S.images || []).find((x) => x.id === form.dataset.img); if (im) { im.title = clean(form.elements.title.value).slice(0, 60) || im.title; im.note = form.elements.note.value.trim().slice(0, 500); im.updatedAt = n; } ui.menu = null; commit(); toast('Saved'); break; }
      case 'new-patient': {
        const b = bedOf(ui.bed);
        const label = form.elements.label.value.trim();
        if (label && E.scanPrivacy(label).length) { toast('That looks like a name or ID number. Use only an approved code, or leave it blank.', 'warn', 7000); break; }
        if (!b) { touchBed(ui.bed, n); }
        const bb = bedOf(ui.bed);
        const prevImgs = E.imagesForBed(S.images, bb).current.map((x) => x.id);
        E.startNewEncounter(bb, n, label);
        ui.menu = null; commit();
        if (form.elements.delimgs && form.elements.delimgs.checked && prevImgs.length) deleteImages(prevImgs, `New patient in ${bb.ref} · previous photos deleted`);
        else toast(`New patient in ${bb.ref}`);
        break;
      }
      case 'pri-reason': if (v.trim()) { const t = task(id); if (t) setPri(t, +form.dataset.l, v.trim(), n); } break;
      case 'answer': if (v.trim()) { const t = task(id); answer(t, t && t.questions.find((x) => x.id === form.dataset.q), v.trim(), n); } break;
      case 'add-bed': {
        const raw = v.trim(); if (!raw) break;
        const pr = E.extractPatient(/^\d/.test(raw) ? 'bed ' + raw : raw);
        const ref = pr ? pr.ref : raw.slice(0, 24);
        touchBed(ref, n); commit(); toast(`${ref} added`); break;
      }
      case 'ctx-other': { const raw = v.trim(); if (!raw) break; const pr = E.extractPatient(/^\d/.test(raw) ? 'bed ' + raw : raw); ui.ctxBed = pr ? pr.ref : raw.slice(0, 24); ui.menu = null; render(); break; }
      case 'priority': {
        const lvl = form.elements.level ? +form.elements.level.value : 0;
        if (!lvl) { toast('Pick P1–P4.', 'warn'); break; }
        const r = E.setPriority(S, id, lvl, form.elements.reason.value, n);
        if (!r.ok) toast(r.error, 'warn'); else { toast(`P${lvl} set`); commit(); }
        break;
      }
      case 'sub-add': if (v.trim()) { const t = task(id); E.updateTask(S, id, { subtasks: [...t.subtasks, { id: E.uid(), text: v.trim(), done: false }] }, n); commit(); setTimeout(() => { const x = $('#sub-new'); if (x) x.focus(); }, 20); } break;
      case 'prereq-add': if (v.trim()) { const t = task(id); t.prereqs.push({ id: E.uid(), text: v.trim(), kind: /\b(mo|senior|specialist|team|family|nurse|dr)\b/i.test(v) ? 'person' : 'condition', met: false, metAt: null }); t.status = E.computeStatus(t); if (!t.waitReason) t.waitReason = 'Waiting for: ' + v.trim(); t.log.push({ at: n, msg: `Prerequisite added: ${v.trim()}` }); t.updatedAt = n; commit(); } break;
      case 'prereq-task': if (v) { const t = task(id), o = task(v); if (o) { t.prereqs.push({ id: E.uid(), text: `“${o.title}” is done`, kind: 'task', taskId: o.id, met: false, metAt: null }); t.status = E.computeStatus(t); t.waitReason = `Blocked until “${o.title}” is done`; t.log.push({ at: n, msg: `Now depends on “${o.title}”` }); t.updatedAt = n; commit(); } } break;
      case 'rem-at': { const at2 = E.fromInput(v); if (at2 && at2 > n) { const t = task(id); t.reminders.push({ id: E.uid(), kind: 'manual', at: at2, text: `Reminder: ${t.title}`, delivery: 'in-app', firedAt: null }); t.reminders.sort((a, b) => a.at - b.at); t.updatedAt = n; toast(`Reminder ${E.fmtWhen(at2, n)} (in app)`); commit(); } else toast('Pick a future time.', 'warn'); break; }
      case 'cancel': snapshot('cancel'); E.setStatus(S, id, 'cancelled', { reason: v }, n); ui.detailId = null; commit(); undoToast('Cancelled'); break;
      case 'complete-note': { const t = task(id); if (t) { snapshot('done'); E.complete(S, id, { mode: 'completed', note: v }, n); ui.menu = null; ui.detailId = null; commit(); undoToast(`Done · ${t.title}`); } break; }
      case 'wait-other': if (v.trim()) { E.setStatus(S, id, 'waiting', { reason: 'Waiting for ' + v.trim(), followUpAction: 'Check: ' + v.trim(), followUpAt: n + 60 * E.MIN }, n); ui.menu = null; ui.detailId = null; commit(); toast('Waiting · re-check in 1 h'); } break;

  async function backupFile() {
    const data = backupString();
    const d = ui.caps.downloads;
    const p = E.parts(now());
    const name = `ho-tasks-backup-${p.y}-${String(p.mo + 1).padStart(2, '0')}-${String(p.d).padStart(2, '0')}.json`;
    if (d) {
      try { await d.save({ filename: name, data }); toast('Backup saved'); return; } catch (e) { if (e && e.code === 'declined') { toast('Backup not saved'); return; } }
    }
    if (!IS_ARTIFACT) {
      try {
        const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
        toast(`Saved ${name} (Downloads)`); return;
      } catch (e) { /* fall through */ }
    }
    copyText(data, 'File saving isn’t available here — backup copied instead');
  }

  // ───────────── PWA plumbing ─────────────
  function setupPWA() {
    window.addEventListener('online', () => { ui.online = true; render(); });
    window.addEventListener('offline', () => { ui.online = false; render(); });
    if (IS_ARTIFACT) return;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); ui.install = e; render(); });
    window.addEventListener('appinstalled', () => { ui.install = null; toast('HO Assistant installed'); render(); });
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then((p) => { ui.persisted = p; if (!p && navigator.storage.persist) return navigator.storage.persist().then((ok) => { ui.persisted = ok; }); }).catch(() => {});
    }
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
    navigator.serviceWorker.register('sw.js').then((reg) => {
      ui.swReg = reg;
      ui.swState = reg.active ? 'active' : 'installing';
      const watch = (w) => w && w.addEventListener('statechange', () => {
        if (w.state === 'activated') ui.swState = 'active';
        if (w.state === 'installed' && navigator.serviceWorker.controller) { ui.updateReady = w; render(); }
      });
      if (reg.waiting && navigator.serviceWorker.controller) { ui.updateReady = reg.waiting; render(); }
      watch(reg.installing);
      reg.addEventListener('updatefound', () => watch(reg.installing));
    }).catch(() => { ui.swState = 'failed'; });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (ui.updateReady && !reloading) { reloading = true; location.reload(); } });
    navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open-task' && e.data.taskId && task(e.data.taskId)) openTask(e.data.taskId); });
  }
  let lastErrorToast = 0;
  function reportError(msg) {
    if (Date.now() - lastErrorToast < 5000) return;
    lastErrorToast = Date.now();
    toast(`Something went wrong (${String(msg).slice(0, 60)}). Saved tasks are safe — reload if the screen looks wrong.`, 'warn', 7000);
  }

  // ───────────── boot ─────────────
  function boot() {
    load();
    try {
      const q = new URLSearchParams(location.search);
      const tab = q.get('tab');
      if (tab === 'rounds') ui.tab = 'beds';
      else if (tab && TITLES[tab] && tab !== 'bed') ui.tab = tab;
      const tid = q.get('task');
      if (tid && task(tid)) ui.detailId = tid;
    } catch (e) { /* no query */ }
    window.addEventListener('error', (e) => reportError(e.message || 'error'));
    window.addEventListener('unhandledrejection', (e) => reportError((e.reason && (e.reason.message || e.reason.code)) || 'error'));
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('toggle', onToggle, true);
    document.addEventListener('focusin', onFocusIn);
    document.addEventListener('focusout', onFocusOut);
    document.addEventListener('pointerdown', (e) => { ui.pointerDown = true; if (e.target.closest && e.target.closest('#strip')) ui.stripHold = true; }, true);
    const up = () => { ui.pointerDown = false; if (ui.renderAfterPointer) { ui.renderAfterPointer = false; setTimeout(render, 0); } };
    document.addEventListener('pointerup', up, true);
    document.addEventListener('pointercancel', up, true);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    window.addEventListener('focus', tick);
    setupPWA();
    render();
    try { const d = localStorage.getItem(DRAFT_KEY); if (d) { const f = $('#capture-input'); f.value = d; autoGrow(f); syncCaptureButtons(); toast('Unsent text restored'); } } catch (e) { /* ignore */ }
    tick();
    setInterval(tick, 20000);
    if (imagesSupported()) { purgeImages(now()).catch(() => {}); setInterval(() => purgeImages(now()).catch(() => {}), 60 * 60000); }
    // a closed chooser (Chrome 113+): nothing is coming
    for (const id of ['img-cam', 'img-pick']) { const inp = document.getElementById(id); if (inp) inp.addEventListener('cancel', () => { try { sessionStorage.removeItem(IMG_PENDING); } catch (e) { /* ignore */ } }); }
    // the phone closed the app while the camera was open (low memory) — the photo cannot reach us, so say so
    try {
      const pend = JSON.parse(sessionStorage.getItem(IMG_PENDING) || 'null');
      sessionStorage.removeItem(IMG_PENDING);
      if (pend && Date.now() - pend.at < 15 * 60000) { ui.menu = { kind: 'img-lost', bed: pend.bed, src: pend.src }; render(); }
    } catch (e) { /* ignore */ }
    if (IS_ARTIFACT) {
      window.claude.use('downloads').then((d) => { ui.caps.downloads = d || null; }).catch(() => {});
      window.claude.use('sample').then((s) => { ui.caps.sample = s || null; if (ui.tab === 'settings') render(); }).catch(() => {});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
<noscript>HO Assistant needs JavaScript turned on.</noscript>
</body>
</html>
