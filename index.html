    const noHoTiming = lowerCore.replace(/\b(?:before|by|until|till|at|pre|prior to|sebelum)\s+(?:the\s+)?(?:hand\s?-?over|pass\s?over|sign\s?out)\b/g, ' ');
    if (/\b(?:hand\s?-?over|pass\s?over|sign\s?out)\b/.test(noHoTiming) && !hasLab && !hasImg) return { cat: 'handover', sub: null, conf: 'high' };
    if (x.team && x.team !== 'Radiology' && x.team !== 'Lab' && /\b(?:review|reply|opinion|input)\b/.test(lowerCore) && (x.waiting || FOLLOW_VERB.test(lv) || /^\S+\s+(?:reply|opinion|input)\b/.test(lv))) return { cat: 'referral', sub: 'followup', conf: 'high' };
    if (/\b(?:refer|rujuk)\s+(?:to\s+)?(?:the\s+)?mo\b|\bdiscuss with (?:the\s+)?(?:mo|specialist|registrar|consultant)\b/.test(lowerCore)) return { cat: 'communication', sub: 'escalate', conf: 'high' };
    if (/\b(?:surat rujukan)\b/.test(lowerCore)) return { cat: 'referral', sub: 'make', conf: x.team ? 'high' : 'medium' };
    if (/\brujuk\b|\brefer(?:ral|red|ring)?\b|\bconsult\b|\bref to\b|\br\/v by\b|\breview by\b|\bseen by\b/.test(lowerCore)) {
      const fu = FOLLOW_VERB.test(lv) && !/^(?:check|confirm|verify)\b.*\brefer\b/.test(lv);
      return { cat: 'referral', sub: fu || /\b(?:referral|review) (?:status|reply|response)\b/.test(lowerCore) ? 'followup' : 'make', conf: x.team ? 'high' : 'medium' };
    }
    if (COMMS_VERB.test(lv)) return { cat: 'communication', sub: /^present\b/.test(lv) ? 'present' : /^(?:call|phone|ring|page|bleep|contact)\b/.test(lv) ? 'call' : 'other', conf: 'high' };
    if (/\bpresent\b/.test(lowerCore) && /\b(?:patient|pt|case|to (?:the )?(?:mo|specialist|consultant|boss|team))\b/.test(lowerCore) && !EDU_RE.test(lowerCore)) return { cat: 'communication', sub: 'present', conf: 'high' };
    if (hasImg) {
      if (/\b(?:result|report|findings|done yet|outcome)\b/.test(lowerCore) || FOLLOW_VERB.test(lv) || x.waiting) return { cat: 'imaging_followup', sub: null, conf: 'high' };
      if (REQUEST_VERB.test(lv)) return { cat: 'imaging_request', sub: null, conf: 'high' };
      return { cat: 'imaging_followup', sub: null, conf: 'medium', ask: 'imaging' };
    }
    if (hasLab) {
      if (/\b(?:result|results|report|out yet|outcome)\b/.test(lowerCore) || FOLLOW_VERB.test(lv) || x.waiting) return { cat: 'inv_followup', sub: null, conf: 'high' };
      if (REQUEST_VERB.test(lv)) return { cat: 'inv_request', sub: null, conf: 'high' };
      if (x.future) return { cat: 'inv_request', sub: null, conf: 'medium' };
      if (x.tests.length === 1 && x.tests[0] === 'bloods') return { cat: 'inv_followup', sub: null, conf: 'medium', ask: 'bloods' };
      const bedside = x.tests.every((t) => ['ECG', 'ABG', 'VBG', 'DXT', 'GXM', 'UPT', 'ketones'].includes(t));
      return { cat: bedside || x.urgentNoVerb ? 'inv_request' : 'inv_followup', sub: null, conf: 'medium', ask: 'lab' };
    }
    if (/\b(?:tca|tcu|temujanji|follow[- ]?up appointment|appointment)\b/.test(lowerCore) && !hasLab && !hasImg) return { cat: 'documentation', sub: 'appointment', conf: 'high' };
    if (/\b(?:i\/o chart|input[- ]output|fluid balance|urine output|vitals|vital signs|obs chart)\b/.test(lowerCore)) return { cat: 'review', sub: null, conf: 'high' };
    if (PROCEDURE_RE.test(lowerCore)) return { cat: 'procedure', sub: null, conf: 'high' };
    if (MEDICATION_RE.test(lowerCore) || /\bubat\b/.test(lowerCore) || new RegExp(DRUG_RE.source, 'i').test(lowerCore)) return { cat: 'medication', sub: null, conf: 'high' };
    if (EDU_RE.test(lowerCore)) return { cat: 'education', sub: null, conf: 'high' };
    if (REVIEW_VERB.test(lv) && (x.patient || /\b(?:patient|pt|case|admission|new case|bed|him|her|uncle|aunty|makcik|pakcik)\b/.test(lowerCore))) return { cat: 'review', sub: null, conf: 'high' };
    if (DOC_RE.test(lowerCore) && (DOC_VERB.test(lv) || /\b(?:notes?|summar|report|letter|census|mc|medical cert\w*|death cert\w*|cert\w*|consent)\b/.test(lowerCore))) return { cat: 'documentation', sub: null, conf: 'high' };
    if (ADMIN_RE.test(lowerCore)) return { cat: 'admin', sub: null, conf: 'high' };
    if (PERSONAL_RE.test(lowerCore)) return { cat: 'personal', sub: null, conf: 'high' };
    if (REVIEW_VERB.test(lv)) return { cat: 'review', sub: null, conf: 'medium' };
    return { cat: 'other', sub: null, conf: 'low' };
  }

  // ───────────────────────── templates ─────────────────────────
  function template(cat, sub, x) {
    const tests = listJoin(x.tests), img = listJoin(x.imaging);
    const plural = x.tests.length > 1 || /s$/.test(tests);
    const team = x.team, coreCap = cap(x.coreClean || '');
    const T = { subtasks: [] };
    switch (cat) {
      case 'emergency':
        T.title = 'Possible emergency: ' + (x.fullClean || x.coreClean || x.segment);
        T.nextAction = 'Follow your hospital’s emergency process now: get immediate help at the bedside and escalate to your MO / on-call team.';
        T.completion = 'Patient assessed and care handed to the responding team or a senior; event documented when safe.';
        T.subtasks = ['Get immediate help at the bedside (hospital emergency process)', 'Escalate to MO / on-call team', 'Document the event when safe'];
        break;
      case 'inv_followup': {
        const vw = verbWord(x.verbSource, FOLLOW_WORDS, 'Check');
        const what = tests || 'investigation';
        if (x.critical) {
          T.title = `Review critical ${tests ? tests + ' ' : ''}result`;
          T.nextAction = 'Review the reported value now and inform your MO, following your hospital’s critical-result process.';
          T.completion = 'Value reviewed, MO informed and action documented per local critical-result process.';
          break;
        }
        T.title = /result/.test(what) ? `${vw} ${what}` : `${vw} ${what} result${plural ? 's' : ''}`;
        T.nextAction = `Check whether the ${what}${/result/.test(what) ? '' : ' result' + (plural ? 's' : '')} ${plural ? 'are' : 'is'} available in your lab results system.`;
        T.completion = `Result${plural ? 's' : ''} reviewed; anything abnormal communicated to your MO and documented per local practice.`;
        break;
      }
      case 'inv_request': {
        const vw = verbWord(x.verbSource, REQUEST_WORDS, /\becg\b/i.test(tests) ? 'Do' : 'Take');
        const what = tests || 'investigation';
        T.title = `${vw} ${what}`;
        T.nextAction = /ECG/.test(what) && x.tests.length === 1
          ? 'Confirm it is in the current plan, then do the ECG and file it in the notes.'
          : `Confirm ${what} ${plural ? 'are' : 'is'} in the current plan, then collect and send with the request form.`;
        T.completion = 'Sample sent / test done. Reviewing the result is a separate follow-up.';
        break;
      }
      case 'imaging_followup':
        T.title = img === 'imaging' ? 'Follow up imaging result' : `Follow up ${img || 'imaging'} result`;
        T.nextAction = `Check whether the ${img || 'scan'} has been done and whether the report is available in your imaging system.`;
        T.completion = 'Report reviewed and any required follow-up action documented or communicated per local procedure.';
        break;
      case 'imaging_request':
        T.title = `Arrange ${img || 'imaging'}`;
        T.nextAction = `Confirm the ${img || 'imaging'} request with your MO, then complete the request and liaise with Radiology per local process.`;
        T.completion = `${img || 'Imaging'} request accepted and the slot noted. Reviewing the report is a separate follow-up.`;
        T.subtasks = ['Confirm the request with your MO', 'Complete the imaging request form', 'Liaise with Radiology for a slot (local process)', 'Note the time and any preparation needed'];
        break;
      case 'referral':
        if (sub === 'followup') {
          T.title = `Follow up ${team || ''} referral`.replace(/\s+/g, ' ');
          T.nextAction = `Check whether ${team || 'the team'} has reviewed the patient; if not, contact them per local process.`;
          T.completion = 'Review done, or expected review time confirmed; plan documented.';
        } else {
          T.title = team ? `Refer to ${team}` : 'Make referral (team not given)';
          T.nextAction = `Confirm the reason and urgency with your MO, then write the referral and contact ${team || 'the receiving team'} per local process.`;
          T.completion = `Referral sent and acknowledged by ${team || 'the team'}. Their review is a separate outcome.`;
          T.subtasks = ['Confirm referral reason and urgency with MO', 'Write the referral (history, findings, results, question)', `Contact ${team || 'the receiving team'} per local process`, 'Note who accepted it and when they will review'];
        }
        break;
      case 'review':
        T.title = /^(?:review|see|reassess|assess|examine|clerk)\b/i.test(x.coreClean)
          ? (x.coreClean.split(' ').length > 1 && !/^\S+\s+(?:now|pls|please|again|today|asap)$/i.test(x.coreClean) ? coreCap : 'Review patient')
          : /\b(?:i\/o|input|output|fluid balance|vitals|obs chart|chart)\b/i.test(x.coreClean) ? coreCap : 'Review patient';
        T.nextAction = 'Review the patient and document. Escalate to your MO if concerned.';
        T.completion = 'Patient reviewed and documented; concerns escalated.';
        break;
      case 'procedure':
        T.title = coreCap;
        T.nextAction = 'Confirm it is in the current plan, prepare equipment, and do it per ward protocol.';
        T.completion = 'Done and documented.';
        break;
      case 'discharge':
        T.title = 'Prepare for discharge';
        T.nextAction = 'Confirm the discharge decision with the responsible clinician.';
        T.completion = 'Discharge steps that apply to this patient are done and communicated. This app does not authorise discharge.';
        T.subtasks = ["Confirm the responsible clinician's discharge decision", 'Check which investigations or reviews remain outstanding', 'Confirm the discharge medication plan with the authorised prescriber', 'Prepare the discharge documentation', 'Check follow-up arrangements and instructions', 'Complete documentation and inform the relevant team'];
        break;
      case 'documentation':
        if (sub === 'discharge_summary' && !/summaries/i.test(x.coreClean)) {
          T.title = 'Prepare discharge summary';
          T.nextAction = 'Draft the discharge summary from the case notes and leave it for MO review per local practice.';
          T.completion = 'Summary drafted and passed for review / sign-off per local practice.';
        } else {
          T.title = coreCap;
          T.nextAction = sub === 'discharge_summary' ? 'Draft each discharge summary from the case notes for MO review.' : 'Complete the entry in the case notes or relevant record.';
          T.completion = 'Documented.';
        }
        break;
      case 'communication':
        if (sub === 'present') {
          const to = x.presentTo || x.assignedBy || 'specialist';
          T.title = `Present patient to ${to}`;
          T.nextAction = 'Prepare a short case summary: key issues, latest results, and your questions.';
          T.completion = 'Case presented; plan documented.';
          T.subtasks = ['Prepare a short case summary (issues, results, questions)', `Present when the ${to} is available`, 'Document the plan'];
        } else if (sub === 'senior') {
          T.title = 'Get senior review';
          T.nextAction = 'Ask your MO or specialist to review the patient; note the plan.';
          T.completion = 'Senior reviewed the patient; plan documented.';
        } else if (sub === 'call') {
          const who = team || (x.callee ? (/^(?:mo|ho|hod|icu|ot|ed|etd|lab)$/i.test(x.callee) ? x.callee.toUpperCase() : /^(?:family|wife|husband|daughter|son|relatives?|nok|patient|pt|nurse|sister|mother|father|waris|keluarga)\b/i.test(x.callee) ? x.callee.toLowerCase() : cap(x.callee)) : null);
          T.title = who ? `Call ${who}${x.topic ? ' about ' + x.topic : ''}` : coreCap;
          T.nextAction = `Call ${who || 'them'}. Note who you spoke to and what was agreed.`;
          T.completion = `Spoken to ${who || 'them'}; outcome noted.`;
        } else {
          T.title = coreCap;
          T.nextAction = 'Make contact and note the outcome.';
          T.completion = 'Communicated; outcome noted.';
        }
        break;
      case 'medication':
        T.title = coreCap;
        T.nextAction = 'Act on the authorised prescriber’s plan. Confirm details with your MO if anything is unclear.';
        T.completion = 'Chart updated as per the plan; nurses informed if needed.';
        break;
      case 'handover':
        T.title = coreCap || 'Prepare handover';
        T.nextAction = 'Open the Handover screen and check each item.';
        T.completion = 'Handover given and the summary verified by you.';
        T.subtasks = ['Check the handover list in this app', 'Check outstanding results and referrals', 'Verify the summary', 'Hand over to the incoming team'];
        break;
      default:
        T.title = coreCap || cap(x.segment);
        T.nextAction = coreCap ? coreCap + '.' : 'Do the task.';
        T.completion = 'Done.';
    }
    T.title = clean(T.title).slice(0, 110);
    return T;
  }

  function estimate(cat, x) {
    let e = CATEGORIES[cat].est;
    if (cat === 'inv_followup') e = Math.min(12, 5 + 2 * Math.max(0, x.tests.length - 1));
    if (cat === 'documentation' && x.sub === 'discharge_summary') e = /summaries/i.test(x.coreClean) ? 60 : 20;
    if (cat === 'communication' && x.sub === 'present') e = 15;
    return e;
  }

  // ───────────────────────── prerequisites ─────────────────────────
  const PREREQ_RE = /\b(?:only\s+)?(?:after|once|when|pending|subject to|if|provided)\s+((?:the\s+)?(?:[a-z0-9&\/'-]+\s+){0,3}?(?:has\s+|have\s+|is\s+|are\s+|gets?\s+)?(?:confirm(?:s|ed)?|agree(?:s|d)?|approve(?:s|d)?|decide(?:s|d)?|ok(?:ay)?(?:s|ed)?|clear(?:s|ed)?|reviews?|reviewed|sees|seen|sign(?:s|ed)?(?:\s+off)?|out|back|available|done|completed?|ready|reported|consent(?:s|ed)?|repl(?:y|ies|ied)|respond(?:s|ed)?|calls?\s+back|comes?\s+back|arrive(?:s|d)?|decision|approval|confirmation|review|plan|input|go-?ahead)\b(?:\s+(?:the\s+)?(?:discharge|plan|it|this|that|patient|pt|transfer|referral|result|report|case))?)/i;
  function extractPrereqs(text) {
    const m = PREREQ_RE.exec(text);
    if (!m) return null;
    const clause = clean(m[1]);
    if (/^(?:rounds?|ward rounds?)$/i.test(clause)) return null;
    const lower = clause.toLowerCase();
    const kind = /\b(?:senior|mo|specialist|consultant|registrar|boss|team|family|relatives?|patient|pt|surgeon|nurse|sister|hod|dr)\b/.test(lower) ? 'person'
      : /\b(?:result|report|ct|mri|scan|bloods?|culture|x-?ray|echo|fbc|u&e)\b/.test(lower) ? 'result' : 'condition';
    return { text: cap(clause.replace(/^the\s+/i, 'The ')).replace(/^The\s+/, ''), kind, match: m[0] };
  }

  const FOLLOWUP_KINDS = [['blood', 'Blood result'], ['imaging', 'Imaging result'], ['referral', 'Referral'], ['senior', 'Review by senior'], ['other', 'Other']];
  /** Referral specialties are configurable: settings.referralTeams, one per line, optional "| channel note". */
  function parseTeams(settings) {
    return String((settings && settings.referralTeams) || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
      const [name, ...rest] = l.split('|');
      return { name: clean(name), channel: clean(rest.join('|')) || null };
    }).filter((t) => t.name);
  }
  function teamList(settings) {
    const names = parseTeams(settings).map((t) => t.name);
    const recent = ((settings && settings.recentTeams) || []).filter((r) => names.includes(r));
    return [...new Set([...recent, ...names])].slice(0, 6);
  }
  function teamChannel(settings, team) {
    if (!team) return null;
    const hit = parseTeams(settings).find((t) => t.name.toLowerCase() === String(team).toLowerCase());
    return hit ? hit.channel : null;
  }

  // ───────────────────────── interpretation ─────────────────────────
  /**
   * interpret(text, ctx) → { drafts, privacy, notes }
   * ctx: { now, settings, currentPatient?, assignedByDefault?, source? }
   * Drafts are complete task objects (not yet stored). Nothing here touches the network.
   */
  function interpret(text, ctx) {
    const now = ctx.now;
    const settings = { ...defaultSettings(), ...(ctx.settings || {}) };
    const input = String(text || '').trim();
    if (!input) return { drafts: [], privacy: [], notes: ['Nothing to interpret.'], audit: null };
    USER_VOCAB = parseVocab(settings);
    try {
      const privacy = scanPrivacy(input);
      const seg = segmentInput(input, ctx.currentPatient || null);
      const drafts = [];
      let prev = null;
      for (const sg of seg.segs) {
        const d = parseSegment(sg, { ...ctx, now, settings, prev, input });
        if (sg.admission) d.entryTags = ['admission'];
        if (sg.join === 'then' && prev) d.prereqs.push({ id: uid(), text: `“${prev.title}” is done`, kind: 'task', taskId: prev.id, met: false, metAt: null });
        drafts.push(d);
        prev = d;
      }
      const admitBeds = new Set(drafts.filter((d) => d.patientRef && ((d.entryTags || []).includes('admission') || ADMIT_RE.test(`${d.segmentOrig || ''} ${d.segment || ''}`))).map((d) => d.patientRef));
      drafts.forEach((d) => { if (d.patientRef && admitBeds.has(d.patientRef)) d.entryTags = ['admission']; });
      drafts.forEach((d) => finalizeDraft(d, now, settings, ctx));
      markDuplicates(drafts, [], now); // within this one entry
      const audit = auditExtraction(input, seg, drafts);
      // Nothing is dropped: any words not matched to a task become an explicit item to review.
      const un = audit.warnings.find((w) => w.type === 'unaccounted');
      if (un) {
        const frag = parseSegment({ text: un.words.join(' '), join: 'and', forceUnresolved: true, patient: null }, { ...ctx, now, settings, prev: null, input });
        finalizeDraft(frag, now, settings, ctx);
        drafts.push(frag);
        audit.tasks = drafts.length; audit.unresolved++; audit.needsDetail++;
      }
      return { drafts, privacy, notes: [], audit };
    } finally { USER_VOCAB = []; }
  }

  function parseSegment(sg, ctx) {
    const { now, settings, prev } = ctx;
    const segText = sg.context ? sg.context + ', ' + sg.text : sg.text;
    const segment = applyVocab(segText); // your shorthand expanded for reading; the original text is kept
    const actionText = applyVocab(sg.text);
    const isWaiting = /^(?:still\s+)?(?:waiting (?:for|on)|awaiting|pending|w\/f|tunggu)\b/i.test(segment);
    const isRemind = /^(?:pls\s+|please\s+)?(?:can you\s+)?remind me\b/i.test(segment);
    // timing on the segment, plus any merged reminder clause
    const timing = extractTiming(segment, { now, settings, waiting: isWaiting });
    let followUpAt = timing.followUpAt;
    let remindAt = timing.remindAt;
    if (sg.reminderClause) {
      const rt = extractTiming(sg.reminderClause, { now, settings, waiting: true });
      followUpAt = rt.followUpAt || rt.deadline || rt.remindAt || followUpAt;
      if (!isWaiting && rt.followUpAt) { remindAt = rt.followUpAt; }
    }

    let work = sg.context ? extractTiming(actionText, { now, settings, waiting: isWaiting }).rest : timing.rest;
    let weakRef = null;
    const patientHit = extractPatient(sg.context ? segment : work);
    let patientRef = null, patientSource = null;
    if (patientHit) { patientRef = patientHit.ref; patientSource = 'entered'; work = work.replace(patientHit.match, ' '); }
    const assignerSrc = sg.context ? segment : work;
    const assigner = extractAssigner(assignerSrc);
    if (assigner) work = work.replace(assigner.match, ' ');
    const prereq = extractPrereqs(work);
    if (prereq) work = work.replace(prereq.match, ' ');
    const ward = extractWard(segment);
    if (ward) work = work.replace(WARD_RE, ' ');
    work = work.replace(/^(?:still\s+)?(?:waiting (?:for|on)|awaiting|pending|w\/f|tunggu)\s+/i, '');
    work = work.replace(/\b(?:stat|asap|urgent(?:ly)?|immediately|right away|right now|segera|cepat)\b/gi, ' ');
    work = work.replace(/\b(?:for|on|in|at|of)\s*(?=[,.;]|$)/gi, ' ');
    let core = clean(stripFiller(clean(work)));
    { const tv = /^(.*\S)[\s,?.!]+(chase|trace|check|semak|f\/u|follow up)[.?!]*$/i.exec(core); if (tv && !startsTask(tv[1])) core = `${tv[2]} ${tv[1].replace(/[?.!]+$/, '')}`; }
    core = core.replace(/\s+(?:for|about|re|regarding|of|in|on)$/i, '').replace(/^(?:for|untuk)\s+(?=\S)/i, '').trim();
    const lowerSeg = segment.toLowerCase();
    const lowerCore = core.toLowerCase();

    let tests = collect(LABS, LAB_GENERIC, lowerSeg);
    let imaging = collect(IMAGING, IMG_GENERIC, lowerSeg);
    let teamHit = extractTeam(lowerSeg);
    // follow-on segments ("…then chase the result", "repeat it tomorrow") inherit what they refer to
    const ownObject = objKindsOf(segment).size > 0 || MEDICATION_RE.test(segment.toLowerCase());
    const refersBack = !ownObject && (/\b(?:it|them|the result|results|report|same)\b/i.test(segment) || sg.join === 'then');
    if (prev && refersBack && !tests.length && !imaging.length) { tests = prev.tests.slice(); imaging = prev.imaging.slice(); }
    if (!patientRef && prev && (sg.join === 'then' || sg.clone) && prev.patientRef) { patientRef = prev.patientRef; patientSource = prev.patientSource === 'entered' ? 'context' : prev.patientSource; }
    if (!patientRef && sg.patient) {
      if (sg.patient.source === 'weak') weakRef = sg.patient.ref; // mentioned earlier mid-sentence: suggest, don't assume
      else { patientRef = sg.patient.ref; patientSource = sg.patient.source === 'entered' ? 'entered' : 'context'; }
    }

    const assignedBy = assigner ? assigner.label : (ctx.assignedByDefault || null);
    const assignedByKind = assigner ? assigner.kind : (ctx.assignedByDefault ? (SENIOR_LABELS[ctx.assignedByDefault.toLowerCase()] ? 'senior' : NURSE_LABELS[ctx.assignedByDefault.toLowerCase()] ? 'nurse' : 'senior') : null);
    const future = !!(timing.notBefore && timing.notBefore > now + 2 * HOUR) || /\b(?:repeat|redo)\b/i.test(segment);
    const fullClean = clean(timing.rest.replace(patientHit ? patientHit.match : '\u0000', ' ').replace(/\s+,/g, ','));
    const urgentNoVerb = !!timing.urgentWord && !startsTask(core);
    const x = { tests, imaging, team: teamHit ? teamHit.label : null, patient: patientRef, waiting: isWaiting, future, coreClean: core, fullClean, segment, verbSource: stripFiller(core), assignedBy, urgentNoVerb };
    let cls = classify(core, lowerCore + ' ' + lowerSeg, x);

    // presentation target / call details
    const presentTo = /\bto (?:the )?(mo|specialist|consultant|registrar|boss|hod|team|dr\.?\s+\w+)\b/i.exec(segment);
    if (presentTo) { const lbl = SENIOR_LABELS[presentTo[1].toLowerCase()] || cap(presentTo[1]); x.presentTo = /^[A-Z]{2,}$|^Dr /.test(lbl) ? lbl : lbl.toLowerCase(); }
    if (cls.cat === 'communication' && cls.sub === 'call') {
      const about = /\b(?:about|re|regarding|for)\s+(.+)$/i.exec(core);
      if (about && !/^(?:bed|pt|patient)\b/i.test(about[1])) x.topic = clean(about[1]).slice(0, 40);
      if (!x.team) { const callee = /^(?:call|phone|ring|page|bleep|contact)\s+(?:the\s+)?([a-z]+(?:\s+[a-z]+)?)/i.exec(stripFiller(core)); if (callee && !/^(?:about|re|for|back)$/i.test(callee[1])) x.callee = callee[1].replace(/\s+(?:about|re|for|regarding)$/i, ''); }
    }

    // safety flags (context-aware)
    const flags = { emergency: false, critical: false, urgent: false, urgentWord: null, needsAssessment: false, emergencyTerm: null, contextNote: null };
    const nonClinical = ['admin', 'education', 'personal'].includes(cls.cat);
    let strong = null;
    for (const re of EMERGENCY_STRONG) { const hit = notNegated(lowerSeg, re); if (hit) { strong = hit; break; } }
    let moderate = null;
    for (const re of EMERGENCY_MODERATE) { const hit = notNegated(lowerSeg, re); if (hit) { moderate = hit; break; } }
    const reporting = ['documentation', 'inv_followup', 'imaging_followup'].includes(cls.cat) && /^(?:document|write|update|complete|finish|f\/u|follow|check|trace|chase)\b/i.test(x.verbSource);
    if (strong && !nonClinical) {
      if (reporting) {
        flags.needsAssessment = true; flags.emergencyTerm = strong;
        flags.contextNote = `Mentions “${strong}”. If this is happening now, follow your hospital’s emergency process.`;
      } else {
        flags.emergency = true; flags.emergencyTerm = strong;
      }
    } else if (strong && nonClinical) {
      flags.contextNote = `Mentions “${strong}” in a ${CATEGORIES[cls.cat].label.toLowerCase()} task, so it was not treated as an emergency. If a patient is affected now, add it as a separate task.`;
    }
    if (CRITICAL_RE.test(lowerSeg) && !nonClinical) flags.critical = true;
    if (!flags.emergency && moderate && !nonClinical) { flags.needsAssessment = true; flags.emergencyTerm = flags.emergencyTerm || moderate; }
    if (timing.urgentWord && !nonClinical) { flags.urgent = true; flags.urgentWord = timing.urgentWord; }
    if (flags.emergency) cls = { cat: 'emergency', sub: null, conf: 'high' };
    else if (flags.critical && ['other', 'inv_followup', 'communication', 'review'].includes(cls.cat)) { cls = { cat: 'inv_followup', sub: null, conf: 'high' }; x.critical = true; }

    // Medication: keep the drug wording exactly; never turn a fragment into an order.
    const drugs = segment.match(new RegExp(DRUG_RE.source, 'gi')) || [];
    if (cls.cat === 'other' && drugs.length) cls = { cat: 'medication', sub: null, conf: 'medium' };
    let medKind = null;
    if (cls.cat === 'medication') {
      const lv = stripFiller(core).toLowerCase();
      if (/^(?:review|check|clarify|confirm|reconcil\w*|prepare|prep|update|rewrite|re-?write|list|discuss|verify|trace|chase|f\/u|follow|semak)\b/.test(lv)) medKind = 'clear';
      else if (/^(?:start|stop|give|hold|withhold|omit|continue|increase|reduce|decrease|titrate|chart|prescribe|serve|load|off|on|switch|change|convert|restart|resume|transfuse|infuse)\b/.test(lv)) medKind = 'order';
      else if (assigner || /\bas per (?:the )?(?:drug )?(?:chart|plan|prescription|kardex)\b/i.test(segment)) medKind = 'order'; // a stated instruction, kept as written
      else medKind = 'unclear';
    }
    // Unrecognised words are kept as an item to clarify, never discarded.
    const anyObject = tests.length || imaging.length || x.team || drugs.length;
    const unresolved = sg.forceUnresolved || (cls.cat === 'other' && cls.conf === 'low' && !anyObject && !startsTask(core) &&
      !/\b(?:call|ask|tell|buy|get|go|make|book|fix|sort|bring|collect|pass|give|see|meet|email|print|sign)\b/i.test(core));

    const T = template(cls.cat, cls.sub, { ...x, sub: cls.sub });
    const est = estimate(cls.cat, { ...x, sub: cls.sub });
    if (medKind === 'unclear') {
      T.title = `${cap(core) || 'Medication'} — clarify action`;
      T.nextAction = 'Clarify the exact instruction with the prescriber before acting. Nothing has been ordered.';
      T.completion = 'Instruction clarified and acted on as the authorised prescriber directs; documented.';
    } else if (medKind === 'order') {
      T.title = cap(core) + (assigner && !/\bas per\b/i.test(core) ? ` (as per ${assigner.label})` : '');
      T.nextAction = 'Act only on the authorised prescriber’s instruction; confirm details if anything is unclear.';
      T.completion = 'Done as instructed by the authorised prescriber; documented.';
    }
    if (cls.ask === 'bloods') {
      T.title = `Bloods${timing.urgentWord ? ` (${timing.urgentWord})` : ''} — take or check?`;
      T.nextAction = 'Say whether the bloods need taking/sending or the results need checking.';
    }
    const kiv = cls.sub === 'kiv';
    if (kiv) {
      const typed = clean(stripFiller(String(sg.orig || sg.text)).replace(patientHit ? patientHit.match : '\u0000', ' ').replace(/^kiv\b\s*/i, '').replace(/[.,;]+$/, ''));
      T.title = `KIV ${typed || '(item)'}`;
      T.nextAction = 'Keep in view: confirm with your MO whether and when it is needed.';
      T.completion = 'Decision on this item confirmed with your MO.';
    }
    if (unresolved) {
      T.title = `Unclear: “${clean(sg.orig || sg.text).slice(0, 60)}”`;
      T.nextAction = 'Say what this item is, or mark it as not a task.';
      T.completion = 'Clarified.';
      T.subtasks = [];
    }

    // questions: short, one field each, options wherever possible; asked one at a time by the UI
    const questions = timing.questions.map((q) => ({ id: uid(), ...q, answered: false }));
    const vagueFollow = ['other', 'review'].includes(cls.cat) && /^(?:f\/u|fu|follow(?:\s|-)?up|chase|trace)\b/i.test(x.verbSource) && !tests.length && !imaging.length && !x.team;
    if (vagueFollow) {
      T.title = 'Follow up (what?)';
      questions.push({ id: uid(), field: 'followupKind', blocking: true, q: 'What needs following up?', options: FOLLOWUP_KINDS.map(([v, l]) => ({ label: l, value: v })), answered: false });
    }
    const meta = CATEGORIES[cls.cat];
    const pronoun = PRONOUN_PATIENT.test(segment);
    const plural = PLURAL_OBJECT.test(segment);
    if (!patientRef && (meta.patient || pronoun || vagueFollow || weakRef) && !plural && !unresolved) {
      questions.push({ id: uid(), field: 'patientRef', pick: 'patient', blocking: cls.cat !== 'emergency', q: weakRef ? `Also ${weakRef}?` : 'Which bed?', suggest: weakRef || null, answered: false });
    }
    if (cls.cat === 'referral' && cls.sub === 'make' && !x.team) {
      questions.push({ id: uid(), field: 'team', pick: 'team', blocking: true, q: 'Referral specialty?', options: teamList(settings).map((o) => ({ label: o, value: o })), answered: false });
    }
    if (unresolved) questions.unshift({ id: uid(), field: 'unresolved', blocking: true, q: 'What is this?', options: [{ label: 'Blood test', value: 'blood' }, { label: 'Referral', value: 'referral' }, { label: 'Review patient', value: 'review' }, { label: 'Medication', value: 'med' }, { label: 'Not a task', value: 'none' }], allowOther: true, answered: false });
    if (medKind === 'unclear') questions.push({ id: uid(), field: 'medAction', blocking: true, q: `${cap(drugs[0] || 'Medication')}: what needs doing?`, options: [{ label: 'Clarify plan with MO', value: 'plan' }, { label: 'Check drug chart', value: 'chart' }, { label: 'Check it was given', value: 'given' }, { label: 'Med reconciliation', value: 'recon' }], allowOther: true, answered: false });
    if (cls.ask === 'bloods') questions.push({ id: uid(), field: 'labAction', blocking: true, q: 'Bloods: take or check?', options: [{ label: 'Take / send now', value: 'inv_request' }, { label: 'Check results', value: 'inv_followup' }], answered: false });
    if (cls.ask === 'lab') questions.push({ id: uid(), field: 'labAction', blocking: false, q: 'Check result or take sample?', options: [{ label: 'Check result', value: 'inv_followup' }, { label: 'Take / send', value: 'inv_request' }], answered: false });
    if (cls.ask === 'imaging') questions.push({ id: uid(), field: 'imgAction', blocking: false, q: 'Follow up or arrange?', options: [{ label: 'Follow up result', value: 'imaging_followup' }, { label: 'Arrange scan', value: 'imaging_request' }], answered: false });
    if (isWaiting && !followUpAt) questions.push({ id: uid(), field: 'followUp', blocking: false, q: 'Re-check when?', options: [{ label: '30 min', value: 30 }, { label: '1 h', value: 60 }, { label: '2 h', value: 120 }, { label: 'Before handover', value: 'handover' }], answered: false });
    if (cls.cat === 'other' && !vagueFollow && !unresolved && !kiv && core.split(' ').length <= 2) questions.push({ id: uid(), field: 'title', blocking: false, q: 'What is it? (a few words)', answered: false });
    const Q_ORDER = { unresolved: -1, followupKind: 0, patientRef: 1, team: 2, medAction: 2, labAction: 2, deadlineChoice: 3 };
    questions.sort((a, b) => (Q_ORDER[a.field] ?? 9) - (Q_ORDER[b.field] ?? 9));

    let waitReason = null, followUpAction = null;
    if (isWaiting) {
      const obj = clean((patientHit ? segment.replace(patientHit.match, ' ') : segment).replace(/^(?:still\s+)?(?:waiting (?:for|on)|awaiting|pending|w\/f|tunggu)\s+/i, '').replace(/\b(?:remind|check again|in \d|in an?|in one)\b.*$/i, ''));
      const restNoPt = patientHit ? timing.rest.replace(patientHit.match, ' ') : timing.rest;
      waitReason = 'Waiting for ' + clean(restNoPt.replace(/^(?:still\s+)?(?:waiting (?:for|on)|awaiting|pending|w\/f|tunggu)\s+/i, '').replace(/[;,].*$/, '').replace(/\s+(?:for|of)\s*$/i, '')) || obj;
      followUpAction = cls.cat.endsWith('followup') ? `Check if the ${listJoin(imaging.length ? imaging : tests) || 'result'} ${imaging.length ? 'report' : 'result'} is out` : `Check on: ${clean(obj)}`;
    }
    if (prereq && prereq.kind !== 'task') { waitReason = waitReason || `Waiting for: ${prereq.text}`; followUpAction = followUpAction || `Check whether ${prereq.text.charAt(0).toLowerCase() + prereq.text.slice(1)}`; }

    if (!unresolved) T.title = tidyTitle(T.title);
    const draft = {
      id: uid(), createdAt: now, updatedAt: now,
      input: ctx.input, segment: segText, segmentOrig: sg.orig ? (sg.context ? sg.context + ', ' + sg.orig : sg.orig) : segText,
      verbInferred: !!sg.inherited, vocabApplied: segment !== segText,
      title: T.title, description: segText,
      category: cls.cat, sub: cls.sub || null, categoryConfidence: unresolved ? 'low' : cls.conf,
      unresolved: !!unresolved, medKind,
      flags, emergencyResolved: null,
      patientRef, patientSource, ward: ward || (ctx.settings.ward || null),
      team: x.team, assignedBy, assignedByKind,
      tests, imaging,
      deadline: timing.deadline, deadlineSource: timing.deadlineSource, deadlineLabel: timing.deadlineLabel, deadlineConfirmed: timing.deadline ? timing.deadlineConfirmed : true,
      notBefore: timing.notBefore, notBeforeLabel: timing.notBeforeLabel,
      followUpAt: followUpAt || null, followUpAction, waitReason,
      remindAt: remindAt || null,
      recurrence: timing.recurrence,
      estMins: est,
      status: 'ready', statusSince: now,
      prereqs: prereq ? [{ id: uid(), text: prereq.text, kind: prereq.kind, met: false, metAt: null }] : [],
      subtasks: T.subtasks.map((s) => ({ id: uid(), text: s, done: false })), subtasksSuggested: T.subtasks.length > 0,
      nextAction: T.nextAction, completionCriteria: T.completion,
      questions,
      notes: [...timing.notes, ...(flags.contextNote ? [flags.contextNote] : [])],
      priorityOverride: null, deferCount: 0, reminders: [], escalationFiredAt: null,
      completion: null, actionDoneAt: null, cancelled: null,
      isDemo: !!ctx.isDemo, source: 'rules', aiFields: [],
      edited: {},
      log: [{ at: now, msg: 'Captured and interpreted by rules' }],
      shiftKey: shiftKeyFor(now, settings),
      privacy: scanPrivacy(segment).map((f) => f.type),
      tags: [],
    };
    if (isWaiting) draft.waitingFromInput = true;
    if (medKind === 'order') draft.notes.push('Medication instruction — act only on the authorised prescriber’s order.');
    if (sg.inherited) draft.notes.push('Verb carried over from the item before it.');
    if (flags.urgent && (unresolved || medKind === 'unclear' || cls.ask === 'bloods')) draft.notes.push(`Marked “${flags.urgentWord}” — kept urgent while it is clarified.`);
    return draft;
  }

  function computeStatus(t) {
    if (!isOpen(t)) return t.status;
    const blockingQ = (t.questions || []).some((q) => q.blocking && !q.answered);
    const unmet = (t.prereqs || []).filter((p) => !p.met);
    if (unmet.some((p) => p.kind === 'task')) return 'blocked';
    if (unmet.length) return 'waiting';
    if (t.waitingFromInput && !t.waitingCleared) return 'waiting';
    if (blockingQ && t.category !== 'emergency') return 'inbox';
    if (t.status === 'in_progress') return 'in_progress';
    if (t.status === 'waiting' && t.manualWaiting) return 'waiting';
    if (t.status === 'blocked' && t.manualBlocked) return 'blocked';
    return 'ready';
  }

  function finalizeDraft(d, now, settings, ctx) {
    d.status = computeStatus(d);
    if (d.status === 'waiting' || d.status === 'blocked') {
      if (!d.waitReason) {
        const unmet = d.prereqs.filter((p) => !p.met);
        d.waitReason = unmet.some((p) => p.kind === 'task') ? 'Blocked until ' + unmet.filter((p) => p.kind === 'task').map((p) => p.text).join(' and ') : unmet.length ? 'Waiting for: ' + unmet.map((p) => p.text).join('; ') : 'Waiting';
      }
      if (!d.followUpAction) d.followUpAction = d.status === 'blocked' ? 'Finish the task it depends on first' : 'Check whether it can go ahead';
    }
    const blocking = d.questions.filter((q) => q.blocking && !q.answered).length;
    d.confidence = {
      overall: blocking ? 'needs_details' : d.categoryConfidence === 'high' && !d.questions.length ? 'high' : 'check',
      category: d.categoryConfidence,
      patient: d.patientRef ? d.patientSource : (CATEGORIES[d.category].patient ? 'missing' : 'n/a'),
      deadline: d.deadline ? (d.deadlineConfirmed ? 'entered' : 'assumed') : 'none',
    };
    d.autoConfirm = !blocking && d.categoryConfidence !== 'low' && !d.privacy.length;
    assignGroup(d, settings);
    d.reminders = buildReminders(d, settings, now, ctx.remindersOperational !== false);
    return d;
  }

  // ───────────────────────── reminders ─────────────────────────
  function buildReminders(t, settings, now, operational = true, existing = []) {
    const lead = settings.reminderLeadMins ?? 15;
    const keep = existing.filter((r) => r.kind === 'manual');
    const auto = [];
    const add = (kind, atMs, text) => {
      if (!atMs || atMs <= now) return;
      const prevSame = existing.find((r) => r.kind === kind && r.at === atMs);
      auto.push(prevSame || { id: uid(), kind, at: atMs, text, delivery: operational ? 'in-app' : 'none', firedAt: null });
    };
    if (isOpen(t)) {
      if (t.deadline && t.deadline > now) add('deadline', Math.max(now + MIN, t.deadline - lead * MIN), `Due ${fmtTime(t.deadline)}: ${t.title}`);
      if (t.followUpAt) add('followup', t.followUpAt, `Check again: ${t.followUpAction || t.title}`);
      if (t.remindAt) add('remind', t.remindAt, `Reminder: ${t.title}`);
    }
    return [...auto, ...keep].sort((a, b) => a.at - b.at);
  }

  /** Alerts due now. Pure: returns what should be shown; the caller marks them fired. */
  function dueAlerts(state, now) {
    const s = state.settings, alerts = [];
    for (const t of state.tasks) {
      if (!isOpen(t)) continue;
      for (const r of t.reminders || []) {
        if (r.firedAt || r.delivery === 'none' || r.at > now) continue;
        alerts.push({ key: t.id + ':' + r.id, taskId: t.id, reminderId: r.id, kind: r.kind, at: r.at, text: r.text, late: now - r.at > 5 * MIN });
      }
      const esc = (s.escalateAfterMins ?? 30) * MIN;
      if (t.deadline && !t.escalationFiredAt && now >= t.deadline + esc && t.status !== 'waiting') {
        alerts.push({ key: t.id + ':esc', taskId: t.id, kind: 'escalation', at: t.deadline + esc, text: `Overdue ${fmtDur((now - t.deadline) / MIN)}: ${t.title}. Escalate to your MO or re-plan.`, late: false });
      }
    }
    const w = shiftWindow(now, s);
    const hoAt = w.handover - (s.handoverLeadMins ?? 60) * MIN;
    const key = 'handover:' + w.handover;
    if (w.state === 'on' && now >= hoAt && now < w.handover && !(state.firedGlobal || {})[key]) {
      const n = state.tasks.filter(isOpen).length;
      alerts.push({ key, kind: 'handover', at: hoAt, text: `Handover at ${fmtTime(w.handover)}. ${n} task${n === 1 ? '' : 's'} still open — check the Handover screen.`, late: false });
    }
    return alerts.sort((a, b) => a.at - b.at);
  }
  function markAlertFired(state, alert, now) {
    if (alert.kind === 'handover') { state.firedGlobal = state.firedGlobal || {}; state.firedGlobal[alert.key] = now; return; }
    const t = state.tasks.find((x) => x.id === alert.taskId);
    if (!t) return;
    if (alert.kind === 'escalation') { t.escalationFiredAt = now; log(t, now, 'Escalation reminder shown in app'); return; }
    const r = (t.reminders || []).find((x) => x.id === alert.reminderId);
    if (r) { r.firedAt = now; log(t, now, `Reminder shown in app${alert.late ? ' (late — app was closed at the time)' : ''}`); }
  }

  // ───────────────────────── priority ─────────────────────────
  const SENIOR_KINDS = new Set(['senior']);
  function dependentsMap(tasks) {
    const map = new Map();
    for (const t of tasks) for (const p of t.prereqs || []) if (p.kind === 'task' && p.taskId && !p.met) {
      if (!map.has(p.taskId)) map.set(p.taskId, []);
      map.get(p.taskId).push(t);
    }
    return map;
  }

  function assess(t, ctx) {
    const now = ctx.now;
    const meta = CATEGORIES[t.category] || CATEGORIES.other;
    const clinical = meta.clinical;
    const f = t.flags || {};
    const reasons = [];
    let level = clinical ? 3 : 4;
    let score = 0;
    const emergency = !!(f.emergency && !t.emergencyResolved);
    if (emergency) { level = 1; reasons.push('Wording suggests a possible emergency — assess now'); }
    if (f.critical && !t.emergencyResolved) { level = 1; reasons.push('Critical result reported — needs prompt review'); }
    const seniorAsked = t.assignedBy && SENIOR_KINDS.has(t.assignedByKind);
    if (f.urgent && (clinical || seniorAsked) && level > 2) { level = 2; reasons.push(seniorAsked && !clinical ? `${t.assignedBy} asked for it ${f.urgentWord}` : `You marked it “${f.urgentWord}”`); }
    else if (f.urgent && level > 3) { level = 3; reasons.push(`Marked “${f.urgentWord}” (non-clinical)`); }
    if (f.needsAssessment && !t.urgencyAssessed && level > 2) { level = 2; reasons.push(`Mentions “${f.emergencyTerm || 'a clinical concern'}” — urgency unclear, so assess rather than assume routine`); }
    if (f.needsAssessment && !t.urgencyAssessed) score += 60;

    if (t.deadline && isOpen(t) && t.status !== 'waiting') {
      const mins = (t.deadline - now) / MIN;
      const hoText = t.deadlineSource === 'handover' ? ' (before handover)' : '';
      if (mins < 0) {
        if (level > 2) level = 2; // a stated deadline has passed: time-sensitive, whatever the category
        score += 300 + Math.min(-mins, 240);
        reasons.unshift(`Overdue by ${fmtDur(mins)}${hoText}`);
      } else if (mins <= 60) {
        if (level > 2) level = 2; // stated deadline within the hour (admin included)
        score += mins <= 15 ? 240 : mins <= 30 ? 200 : 160;
        reasons.push(`Due in ${fmtDur(mins)}${hoText}`);
      } else {
        score += mins <= 120 ? 110 : mins <= 240 ? 60 : mins <= 480 ? 25 : 5;
        reasons.push(`Due ${fmtWhen(t.deadline, now)}${hoText}${t.deadlineConfirmed ? '' : ' (assumed)'}`);
      }
    }
    if (t.assignedBy && SENIOR_KINDS.has(t.assignedByKind)) {
      score += t.deadline ? 40 : 15;
      reasons.push(t.deadline ? `Requested by ${t.assignedBy} with a deadline` : `Requested by ${t.assignedBy}`);
    }
    if (!ctx.noDeps) {
      const deps = (ctx.dependents && ctx.dependents.get(t.id)) || [];
      const openDeps = deps.filter(isOpen);
      if (openDeps.length) {
        score += Math.min(120, 40 * openDeps.length);
        reasons.push(`${openDeps.length} other task${openDeps.length > 1 ? 's depend' : ' depends'} on this`);
        const depLevel = Math.min(...openDeps.map((d) => assess(d, { ...ctx, noDeps: true }).level));
        if (depLevel < level) { level = depLevel; reasons.push(`Raised to P${depLevel} to unblock a dependent task`); }
      }
    }
    if ((t.deferCount || 0) >= 2) {
      score += 15 * t.deferCount;
      reasons.push(`Deferred ${t.deferCount} times`);
      if (t.deferCount >= 3 && level === 4) level = 3;
    }
    if (t.status === 'waiting' && t.followUpAt && t.followUpAt <= now) { score += 120; reasons.push('Follow-up time reached'); }
    if (t.status === 'in_progress') { score += 80; reasons.push('Already in progress'); }
    if ((t.estMins || 10) <= 5) score += 10;
    // within the same level, checking results and seeing patients come before paperwork
    score += ({ inv_followup: 25, imaging_followup: 20, review: 20, inv_request: 20, procedure: 15, medication: 15, referral: 20, imaging_request: 10, communication: 10, discharge: 10, handover: 5, other: 5 })[t.category] || 0;
    score += Math.min(30, ((now - (t.createdAt || now)) / HOUR) * 5);
    // needed before a discharge / transfer / procedure: time-sensitive only when that is today
    const beforeEvt = /\bbefore\s+(?:the\s+)?(discharge|d\/c|transfer|ot|op|operation|surgery|procedure|scope|ogds|mri|ct)\b/i.exec(t.segment || '');
    let noTime = false;
    if (beforeEvt && level > 2 && (!t.deadline || !t.deadlineConfirmed)) {
      if (/\b(?:today|tdy|this (?:morning|afternoon)|now|asap|stat|segera)\b/i.test(t.segment || '')) { level = 2; reasons.unshift(`Needed before ${beforeEvt[1]} today`); }
      else { if (level > 3) level = 3; reasons.push(`Needed before ${beforeEvt[1]} — no time given`); noTime = true; }
    }
    // future date or later shift = Scheduled (P4), unless something makes it urgent now
    const sw = shiftWindow(now, ctx.settings || defaultSettings());
    const horizon = sw.state === 'on' ? sw.end : now + 12 * HOUR;
    const futureAt = t.notBefore && t.notBefore > horizon ? t.notBefore : (!t.notBefore && t.deadline && t.deadline > horizon && t.deadlineSource !== 'handover' ? t.deadline : null);
    if (futureAt && level >= 3 && !f.urgent && !(f.needsAssessment && !t.urgencyAssessed)) { level = 4; reasons.unshift(`Scheduled · ${fmtWhen(futureAt, now)}`); }
    // your usual priority for this kind of task — only between Routine and Scheduled, never for urgent work
    const sig = (ctx.settings && ctx.settings.priRules) ? groupSignature(t) : null;
    const learnedLevel = sig && ctx.settings.priRules[sig];
    if ([3, 4].includes(learnedLevel) && level >= 3 && !t.deadline && !f.urgent && !futureAt && !(f.needsAssessment && !t.urgencyAssessed) && learnedLevel !== level) { level = learnedLevel; reasons.push('Your usual priority for this kind of task'); }
    // provisional: not enough information to be sure — say so, and say who confirms
    const prov = [];
    if (f.needsAssessment && !t.urgencyAssessed) prov.push('urgency unclear — check with your MO');
    if (t.unresolved) prov.push('not clear what this is yet');
    if (t.medKind === 'unclear') prov.push('medication instruction unclear');
    if ((t.questions || []).some((q) => !q.answered && q.blocking && ['labAction', 'imgAction', 'followupKind', 'deadlineChoice'].includes(q.field))) prov.push('needs your answer first');
    if (t.deadline && !t.deadlineConfirmed) prov.push('deadline assumed');
    if (noTime) prov.push('no time given');
    if (t.aiMissed) prov.push('suggested by AI');
    const engineLevel = level;
    let overridden = false;
    if (t.priorityOverride && t.priorityOverride.level) {
      level = t.priorityOverride.level; overridden = true;
      reasons.unshift(`Set to P${level} by you${t.priorityOverride.reason ? ' — ' + t.priorityOverride.reason : ''} (rules suggest P${engineLevel})`);
    }
    if (!reasons.length) reasons.push(clinical ? 'Routine clinical task — no deadline or urgency given' : `Non-urgent ${meta.label.toLowerCase()} task`);
    const depCount = ctx.noDeps ? 0 : (((ctx.dependents && ctx.dependents.get(t.id)) || []).filter(isOpen).length);
    const provisional = !overridden && prov.length ? prov : null;
    return { level, engineLevel, score: Math.round(score), reasons, overridden, emergency, dependents: depCount, provisional };
  }

  /** One short reason, only when it changes what you do. Null for ordinary routine tasks. */
  function shortReason(t, a, now) {
    const f = t.flags || {};
    if (a && a.emergency) return 'Possible emergency';
    if (f.critical && !t.emergencyResolved) return 'Critical result';
    if (t.deadline && isOpen(t) && t.status !== 'waiting') {
      const mins = (t.deadline - now) / MIN;
      if (mins < 0) return `Overdue ${fmtDur(mins)}`;
      if (t.deadlineSource === 'handover' && mins <= 6 * 60) return `Before handover · ${fmtTime(t.deadline)}`;
      if (mins <= 120) return `Due ${fmtTime(t.deadline)}${t.deadlineConfirmed ? '' : '?'}`;
    }
    if (f.needsAssessment && !t.urgencyAssessed) return 'Urgency unclear — assess';
    if (t.status === 'waiting' && t.followUpAt && t.followUpAt <= now) return 'Re-check due';
    if (a && a.dependents) return 'Unblocks another task';
    if (f.urgent) return `Marked ${f.urgentWord}`;
    if (t.assignedBy && t.assignedByKind === 'senior') return `${t.assignedBy} asked`;
    if (a && a.overridden) return `Your priority P${a.level}`;
    return null;
  }

  function stateOf(t, now, byId) {
    if (!isOpen(t)) return t.status;
    if (t.flags && t.flags.emergency && !t.emergencyResolved) return 'emergency';
    const unmet = (t.prereqs || []).filter((p) => !p.met);
    if (t.status === 'blocked' || unmet.some((p) => p.kind === 'task')) return 'blocked';
    if (t.status === 'waiting' || unmet.length) return t.followUpAt && t.followUpAt <= now ? 'followup' : 'waiting';
    if (t.notBefore && t.notBefore > now) return 'later';
    return 'actionable';
  }

  // ───────────────────────── batching ─────────────────────────
  /**
   * Batches group tasks by WORKFLOW STAGE, not by broad category: taking bloods, checking results and
   * acting on results are different sessions. A batch only holds task ids — the tasks stay where they are.
   * setup = minutes of shared set-up a batch saves per extra task (rough, used only to decide if a batch is worth it).
   */
  const BATCH_KINDS = {
    referral: { label: 'Referral round', noun: ['referral', 'referrals'], setup: 4, max: 6, reason: 'Similar referrals — one sitting', note: 'Each specialty may use a different channel — check each one.' },
    referral_reply: { label: 'Referral replies to chase', noun: ['reply', 'replies'], setup: 2, max: 8, reason: 'Chase replies together' },
    bloods: { label: 'Blood taking', noun: ['sample', 'samples'], setup: 6, max: 6, bedside: true, reason: 'One round with the trolley', note: 'Only tests already in each patient’s plan. Label and send each sample on its own.' },
    bedside: { label: 'Bedside jobs', noun: ['job', 'jobs'], setup: 3, max: 6, bedside: true, reason: 'One round of the ward' },
    requests: { label: 'Imaging requests', noun: ['request', 'requests'], setup: 3, max: 8, reason: 'Request forms together' },
    results: { label: 'Results to check', noun: ['result', 'results'], setup: 2, max: 8, reason: 'Check results together', note: 'Check what is actually back. Pending ones stay in Waiting; anything abnormal goes to your MO.' },
    mo_update: { label: 'MO update', noun: ['item', 'items'], setup: 4, max: 8, reason: 'One update, patient by patient', note: 'Go patient by patient — don’t merge patients into one message.' },
    calls: { label: 'Calls', noun: ['call', 'calls'], setup: 1, max: 6, min: 3, reason: 'Calls together' },
    docs: { label: 'Documentation', noun: ['item', 'items'], setup: 3, max: 6, reason: 'Paperwork in one sitting' },
    meds: { label: 'Drug charts', noun: ['chart', 'charts'], setup: 2, max: 6, reason: 'Charts together' },
    reviews: { label: 'Patient reviews', noun: ['review', 'reviews'], setup: 2, max: 6, bedside: true, reason: 'Same ward — one walk' },
    admin: { label: 'Admin', noun: ['item', 'items'], setup: 2, max: 6, min: 3, reason: 'Admin in one go' },
  };
  /** Pairs you can ask to be done together ("Group these together"). */
  const BATCH_MERGES = [['referral', 'referral_reply'], ['results', 'mo_update'], ['calls', 'mo_update'], ['docs', 'meds'], ['bloods', 'bedside'], ['requests', 'docs']];
  const BEDSIDE_TESTS = new Set(['ECG', 'DXT', 'UPT', 'urine FEME', 'urine C&S', 'ketones']);
  const STAGE_QUESTIONS = new Set(['labAction', 'imgAction', 'followupKind', 'unresolved', 'medAction', 'aiMissed', 'patientRef', 'deadlineChoice']);

  // ───────────────────────── the seven task categories (what you see) ─────────────────────────
  /**
   * Every task gets one of seven categories, worked out from the detailed internal type plus its words.
   * The internal type still drives templates and batching; the category is the label you sort and filter by.
   */
  const GROUPS = {
    rounds: { label: 'Rounds & Updates', short: 'Rounds' },
    investigations: { label: 'Investigations & Results', short: 'Ix' },
    documentation: { label: 'Documentation', short: 'Docs' },
    referrals: { label: 'Referrals & Communication', short: 'Ref' },
    procedures: { label: 'Procedures & Clinical Orders', short: 'Proc' },
    discharge: { label: 'Discharge & Transfer', short: 'D/C' },
    admission: { label: 'Admission & Clerking', short: 'Admit' },
  };
  const GROUP_TAGS = { ...Object.fromEntries(Object.entries(GROUPS).map(([k, v]) => [k, v.short])), emergency: 'Emergency', handover: 'Handover', admin: 'Admin', personal: 'Personal' };
  const ADMIT_RE = /\b(?:new (?:case|admission|admit|patient|pt)|clerk(?:ing|ed)?|admission|admitted|kemasukan|pesakit baru|baru masuk)\b/i;
  const TRANSFER_RE = /\btransfer\w*\b|\bpindah\b|\btransport\b|\bambulan(?:ce|s)\b/i;
  const SAMPLE_VERB = /^(?:take|ambil|draw|collect|bleed|withdraw|send|hantar|resend|re-send|do)\b/i;

  /** Rules-only category + secondary tags for a task. */
  function ruleGroup(t) {
    const src = `${t.segmentOrig || ''} ${t.segment || ''} ${t.title || ''}`;
    const low = src.toLowerCase();
    const v = stripFiller(clean(t.segment || t.title || '')).toLowerCase();
    const tags = new Set();
    let g;
    switch (t.category) {
      case 'emergency': g = 'rounds'; tags.add('emergency'); break;
      case 'inv_followup': case 'imaging_followup': case 'imaging_request': g = 'investigations'; break;
      case 'inv_request': {
        const bedside = (t.tests || []).length > 0 && t.tests.every((x) => BEDSIDE_TESTS.has(x));
        const specimen = (t.tests || []).some((x) => !['ECG', 'DXT'].includes(x));
        if (bedside || SAMPLE_VERB.test(v)) { g = 'procedures'; if (specimen) tags.add('investigations'); } else { g = 'investigations'; }
        break;
      }
      case 'procedure': g = /^(?:r\/v|review|reassess|see|check|assess|look at)\b/.test(v) ? 'rounds' : 'procedures'; break;
      case 'referral': case 'communication': g = 'referrals'; break;
      case 'review': g = 'rounds'; break;
      case 'handover': g = 'rounds'; tags.add('handover'); break;
      case 'discharge': g = 'discharge'; break;
      case 'documentation':
        if (t.sub === 'appointment') g = 'discharge';
        else if (TRANSFER_RE.test(low)) { g = 'discharge'; tags.add('documentation'); } else g = 'documentation';
        if (t.sub === 'discharge_summary') tags.add('discharge');
        break;
      case 'medication':
        if (/\breconcil\w*|\bmed(?:ication)?\s*rec\b/.test(low)) g = 'documentation';
        else if (/\btt[ao]s?\b|\bdischarge (?:meds?|medications?)\b/.test(low)) g = 'discharge';
        else g = 'procedures';
        break;
      case 'admin': case 'education': case 'personal': g = 'documentation'; tags.add(t.category === 'personal' ? 'personal' : 'admin'); break;
      default: g = TRANSFER_RE.test(low) ? 'discharge' : 'rounds';
    }
    // a new admission: clerking is the admission task itself; its other jobs keep their own category and get the tag
    if (ADMIT_RE.test(low) || (t.entryTags || []).includes('admission')) {
      const clerkNotes = /\b(?:update|complete|finish|write|rewrite)\b.*\bclerk(?:ing)?\s+notes?\b/.test(low);
      if (clerkNotes) { g = 'documentation'; tags.add('admission'); }
      else if (/\bclerk(?:ing|ed)?\b/.test(low) && !['referral', 'communication', 'inv_request', 'inv_followup', 'imaging_request', 'imaging_followup'].includes(t.category)) g = 'admission';
      else if (g === 'rounds' && ADMIT_RE.test(low)) g = 'admission';
      else tags.add('admission');
    }
    if (g !== 'discharge' && /\b(?:for|before|plan(?:ning)?)\s+(?:discharge|d\/c|home)\b|\bdischarge today\b/.test(low)) tags.add('discharge');
    tags.delete(g);
    return { group: g, tags: [...tags] };
  }
  /** A privacy-safe key for learning your corrections: type + verb + object kinds. Never words about the patient. */
  function groupSignature(t) {
    const v = stripFiller(clean(t.segment || t.title || '')).toLowerCase().replace(/^(?:bed|bd|katil)\s*\d+[a-z]?\s*/, '');
    const w = (/^(\S+)/.exec(v) || [])[1] || '';
    const verb = TASK_START.test(w) || STRONG_VERB.test(w) ? w : '';
    const kinds = [...objKindsOf(v)].sort().join(',');
    if (!verb && !kinds) return null;
    return `${t.category}|${t.sub || ''}|${verb}|${kinds}`;
  }
  /** Set t.group / t.groupTags (keeps your own choice; applies a learned correction if there is one). */
  function assignGroup(t, settings) {
    const r = ruleGroup(t);
    t.groupTags = r.tags;
    if (t.groupSource === 'user' && GROUPS[t.group]) return t;
    const sig = groupSignature(t);
    const learned = sig && settings && settings.catRules && settings.catRules[sig];
    if (learned && GROUPS[learned]) { t.group = learned; t.groupSource = 'learned'; if (r.group !== learned) t.groupTags = [...new Set([...r.tags, r.group])].filter((x) => x !== learned); }
    else { t.group = r.group; t.groupSource = 'rules'; }
    return t;
  }
  /** One-tap category change. Remembers it for similar tasks (type + verb only). */
  function setGroup(state, taskId, group, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t || !GROUPS[group]) return { ok: false, error: 'Unknown category' };
    const before = t.group;
    t.group = group; t.groupSource = 'user';
    t.groupTags = (t.groupTags || []).filter((x) => x !== group);
    log(t, now, `Category changed by you: ${GROUPS[before] ? GROUPS[before].label : '—'} → ${GROUPS[group].label}`);
    const sig = groupSignature(t);
    let learned = false;
    if (sig) {
      state.settings.catRules = { ...(state.settings.catRules || {}) };
      if (ruleGroup(t).group === group) delete state.settings.catRules[sig]; else state.settings.catRules[sig] = group;
      learned = true;
    }
    return { ok: true, task: t, learned };
  }

  function batchKind(t, state) {
    const follow = state === 'followup';
    switch (t.category) {
      case 'referral': return t.sub === 'followup' || follow ? 'referral_reply' : 'referral';
      case 'inv_request': if (follow) return 'results'; return (t.tests || []).length && t.tests.every((x) => BEDSIDE_TESTS.has(x)) ? 'bedside' : 'bloods';
      case 'procedure': return 'bedside';
      case 'imaging_request': return follow ? 'results' : 'requests';
      case 'inv_followup': case 'imaging_followup': return 'results';
      case 'communication':
        if (t.sub === 'call') return 'calls';
        if (['present', 'escalate', 'senior'].includes(t.sub) || /\b(?:mo|specialist|consultant|registrar|senior|hod)\b/i.test(`${t.title} ${t.segment || ''}`)) return 'mo_update';
        return 'calls';
      case 'documentation': case 'discharge': return 'docs';
      case 'medication': return t.medKind === 'unclear' ? null : 'meds';
      case 'review': return 'reviews';
      case 'admin': case 'education': return 'admin';
      default: return null;
    }
  }
  const dlClass = (t, now) => (!t.deadline || t.status === 'waiting' ? 3 : t.deadline < now ? 0 : t.deadline - now <= HOUR ? 1 : 3);
  function kindMins(kind, t, settings, prefs) {
    const set = settings.batchMins && +settings.batchMins[kind];
    if (set > 0) return set;
    const times = settings.learnTimes && prefs && prefs.times && prefs.times[kind];
    if (times && times.length >= 3) { const s = times.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; }
    return t.estMins || 10;
  }
  const roundEst = (m) => (m < 10 ? Math.max(5, Math.round(m)) : Math.round(m / 5) * 5);
  /** Why a task cannot go into a routine batch right now (null = it can). Safety rules come first. */
  function batchBlocker(it, now) {
    const t = it.t, a = it.a, f = t.flags || {};
    if (it.state === 'emergency' || a.emergency) return { why: 'Possible emergency — not batched', hard: true };
    if (f.critical && !t.emergencyResolved) return { why: 'Critical result — review now', hard: true };
    if (a.level <= 2) return { why: a.level === 1 ? 'Immediate — on its own' : 'Urgent — do it on its own first', hard: true };
    if (f.needsAssessment && !t.urgencyAssessed) return { why: 'Urgency unclear — assess first', hard: true };
    if (t.deadline && t.status !== 'waiting' && t.deadline < now) return { why: 'Overdue — do it now', hard: true };
    const q = (t.questions || []).find((x) => !x.answered && x.blocking && STAGE_QUESTIONS.has(x.field));
    if (q) return { why: `Answer first: ${q.q}`, hard: true };
    if (t.batchOptOut) return { why: 'Kept separate by you', soft: true };
    return null;
  }
  function stateWhy(it, now) {
    const t = it.t;
    const unmet = (t.prereqs || []).filter((p) => !p.met);
    if (it.state === 'blocked' || it.state === 'waiting') return unmet.length ? `Waiting for: ${unmet.map((p) => p.text).join('; ')}` : t.waitReason || 'Waiting';
    if (it.state === 'later') return `From ${fmtWhen(t.notBefore, now)}`;
    return '';
  }

  /**
   * Find batches worth making. Returns {batches, singles}: every eligible task is in exactly one of them.
   * opts.prefs = learned feedback; opts.activeKey keeps the started batch together even if it has 1 task left.
   */
  function buildBatches(items, now, settings, opts = {}) {
    const prefs = opts.prefs || {};
    const kp = (k) => (prefs.kinds && prefs.kinds[k]) || {};
    const merged = (k) => { const m = BATCH_MERGES.find((pair) => pair.includes(k) && prefs.merge && prefs.merge[pair.join('+')]); return m ? m.join('+') : k; };
    const groups = new Map();
    const blockedBy = new Map();
    const ready = items.filter((i) => ['actionable', 'followup', 'emergency'].includes(i.state));
    for (const it of ready) {
      const kind = batchKind(it.t, it.state);
      if (!kind) continue;
      const b = batchBlocker(it, now);
      if (b) { blockedBy.set(it.t.id, { ...b, kind }); continue; }
      if (settings.batching === false || kp(kind).off) continue;
      const gk = merged(kind);
      const bedside = gk.split('+').some((k) => BATCH_KINDS[k].bedside);
      const ward = bedside && settings.groupByWard !== false ? (it.t.ward || '') : '';
      const key = gk + (ward ? '@' + ward : '');
      if (!groups.has(key)) groups.set(key, { key, kind: gk, ward, items: [] });
      groups.get(key).items.push(it);
    }
    // ward split only matters when more than one ward is known for that kind
    for (const [key, g] of [...groups]) {
      if (!g.ward) continue;
      const siblings = [...groups.values()].filter((x) => x.kind === g.kind);
      if (siblings.length === 1) { groups.delete(key); const k2 = g.kind; if (groups.has(k2)) groups.get(k2).items.push(...g.items); else groups.set(k2, { key: k2, kind: k2, ward: '', items: g.items, wardAll: g.ward }); }
    }
    const batches = [];
    const inBatch = new Set();
    for (const g of groups.values()) {
      const kinds = g.kind.split('+');
      const def = BATCH_KINDS[kinds[0]];
      const label = kinds.map((k) => BATCH_KINDS[k].label).join(' + ');
      const minSize = Math.max(...kinds.map((k) => Math.min(4, (BATCH_KINDS[k].min || 2) + Math.max(0, (kp(k).poor || 0) - (kp(k).good || 0)))));
      const isActive = opts.activeKey && (opts.activeKey === g.key || opts.activeKey.split('#')[0] === g.key);
      // deadline-first, then priority; bedside work by bed number so the walk is short
      const ord = g.items.slice().sort((x, y) => (x.t.deadline || Infinity) - (y.t.deadline || Infinity) || x.a.level - y.a.level ||
        (def.bedside ? String(x.t.patientRef || '~').localeCompare(String(y.t.patientRef || '~'), undefined, { numeric: true }) : 0) || y.a.score - x.a.score);
      // a member whose deadline would be missed by waiting for the others is not held for the batch
      const members = [], tight = [];
      let elapsed = 0;
      for (const it of ord) {
        const m = kindMins(kinds[0], it.t, settings, prefs);
        if (it.t.deadline && it.t.deadline < now + (elapsed + m + 20) * MIN) { tight.push(it); continue; }
        members.push(it); elapsed += m;
      }
      for (const it of tight) blockedBy.set(it.t.id, { why: `Due ${fmtTime(it.t.deadline)} — not held for the batch`, hard: true, kind: g.kind });
      const benefit = (def.setup || 2) * (members.length - 1);
      if (!isActive && (members.length < minSize || (members.length < 3 && benefit < 3))) continue;
      if (!members.length && !isActive) continue;
      const cap = Math.max(...kinds.map((k) => BATCH_KINDS[k].max || 6));
      for (let c = 0; c * cap < Math.max(members.length, isActive ? 0 : 1); c++) {
        const part = members.slice(c * cap, (c + 1) * cap);
        if (!part.length) break;
        if (c > 0 && part.length < minSize) { /* small remainder stays as single tasks */ break; }
        const sum = part.reduce((s, it) => s + kindMins(kinds[0], it.t, settings, prefs), 0);
        const est = roundEst(Math.max(sum * 0.6, sum - (def.setup || 2) * (part.length - 1)));
        const deadline = Math.min(...part.map((it) => it.t.deadline || Infinity));
        const beforeHo = part.some((it) => it.t.deadlineSource === 'handover');
        const key = g.key + (c ? '#' + (c + 1) : '');
        part.forEach((it) => inBatch.add(it.t.id));
        batches.push({
          key, kind: g.kind, kinds, ward: g.ward || g.wardAll || '', label: label + (g.ward ? ` · ${g.ward}` : '') + (c ? ` (${c + 1})` : ''),
          members: part, ids: part.map((it) => it.t.id), estMins: est,
          level: Math.min(...part.map((it) => it.a.level)), score: Math.max(...part.map((it) => it.a.score)) + 15,
          deadline: deadline === Infinity ? null : deadline, cls: Math.min(...part.map((it) => dlClass(it.t, now))),
          reason: beforeHo ? `${def.reason} · includes one due before handover` : def.reason,
          note: kinds.map((k) => BATCH_KINDS[k].note).filter(Boolean).join(' '),
          mergeWith: BATCH_MERGES.filter((p) => p.includes(kinds[0]) && !(prefs.merge && prefs.merge[p.join('+')]) && kinds.length === 1).map((p) => p.find((k) => k !== kinds[0])),
        });
      }
    }
    // tasks of the same kind that are not in the batch, and why (shown inside the batch so nothing disappears)
    for (const b of batches) {
      b.notIn = [];
      for (const it of items) {
        if (inBatch.has(it.t.id)) continue;
        const k = batchKind(it.t, it.state);
        if (!k || !b.kinds.includes(k)) continue;
        if (b.ward && (it.t.ward || '') !== b.ward) continue;
        const bl = blockedBy.get(it.t.id);
        const why = bl ? bl.why : stateWhy(it, now);
        if (why) b.notIn.push({ t: it.t, why, soft: !!(bl && bl.soft) });
      }
    }
    return { batches, inBatch, blockedBy };
  }

  /** Within the same priority level and deadline class, keep last plan's order unless a score jumped. */
  function stabilise(units, memo) {
    if (!memo || !Array.isArray(memo.order)) return units;
    const prev = new Map(memo.order.map((k, i) => [k, i]));
    const prevScore = memo.scores || {};
    const seen = (u) => prev.has(u.key) && !(prevScore[u.key] != null && u.score - prevScore[u.key] >= 50);
    let i = 0;
    while (i < units.length) {
      let j = i;
      while (j < units.length && units[j].level === units[i].level && units[j].cls === units[i].cls) j++;
      const slots = [], keep = [];
      for (let k = i; k < j; k++) if (seen(units[k])) { slots.push(k); keep.push(units[k]); }
      keep.sort((a, b) => prev.get(a.key) - prev.get(b.key));
      slots.forEach((s, n) => { units[s] = keep[n]; });
      i = j;
    }
    return units;
  }

  /**
   * Build the "what should I do now?" plan. Pure.
   * opts: { memo (last order, for stability), active (started batch), prefs (batch feedback) }
   */
  function plan(tasks, now, settings, opts = {}) {
    settings = { ...defaultSettings(), ...(settings || {}) };
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const dependents = dependentsMap(tasks);
    const ctx = { now, settings, dependents, byId };
    const items = tasks.filter(isOpen).map((t) => ({ t, a: assess(t, ctx), state: stateOf(t, now, byId) }));
    const actionable = items.filter((i) => ['emergency', 'actionable', 'followup'].includes(i.state));
    const active = opts.active && opts.active.key ? opts.active : null;
    const { batches, inBatch } = buildBatches(items, now, settings, { prefs: opts.prefs, activeKey: active && active.key });

    // units: single tasks + batches. Rank by level, then deadline class, then (stably) score.
    const units = [];
    for (const it of actionable) if (!inBatch.has(it.t.id)) units.push({ key: 't:' + it.t.id, type: 'task', it, level: it.a.level, cls: dlClass(it.t, now), score: it.a.score, created: it.t.createdAt || 0 });
    for (const b of batches) {
      const u = { key: 'b:' + b.key, type: 'batch', batch: b, level: b.level, cls: b.cls, score: b.score, created: 0 };
      if (active && (active.key === b.key)) { u.active = true; u.cls = Math.min(u.cls, 1.5); u.level = Math.min(u.level, 3); }
      units.push(u);
    }
    units.sort((x, y) => x.level - y.level || x.cls - y.cls || y.score - x.score || x.created - y.created);
    stabilise(units, opts.memo);
    // same patient as the task before: pull it forward among equal routine single tasks (saves a trip)
    const recent = tasks.filter((t) => t.status === 'in_progress' || (t.completion && now - t.completion.at < 30 * MIN)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    let lastPatient = recent ? recent.patientRef : null;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (u.type === 'task' && lastPatient && u.level >= 3 && u.cls >= 3 && u.it.t.patientRef !== lastPatient) {
        const j = units.findIndex((v, k) => k > i && v.type === 'task' && v.level === u.level && v.cls === u.cls && v.it.t.patientRef === lastPatient && v.score >= u.score - 60);
        if (j > i) { const [v] = units.splice(j, 1); v.it.batched = `Same patient (${lastPatient}) as the task before — saves a trip`; units.splice(i, 0, v); }
      }
      const cu = units[i];
      const pr = cu.type === 'task' ? cu.it.t.patientRef : (cu.batch.members[cu.batch.members.length - 1].t.patientRef);
      if (pr) lastPatient = pr;
    }

    // flat queue for list views (batch members in batch order)
    const queue = [];
    for (const u of units) { if (u.type === 'task') queue.push(u.it); else for (const it of u.batch.members) queue.push({ ...it, batchKey: u.batch.key }); }

    // the started batch: progress over everything that has been part of it
    let activeView = null;
    if (active) {
      const live = batches.find((b) => b.key === active.key) || null;
      const seenIds = [...new Set([...(active.memberIds || []), ...(live ? live.ids : [])])];
      const skipped = new Set(active.skipped || []);
      const rows = seenIds.map((id) => byId.get(id)).filter(Boolean).map((t) => {
        const inLive = live && live.ids.includes(t.id);
        const st = t.status === 'completed' ? 'done' : t.status === 'cancelled' ? 'cancelled' : !isOpen(t) ? 'done' : ['waiting', 'blocked'].includes(t.status) || (t.prereqs || []).some((p) => !p.met) ? 'waiting' : inLive ? 'todo' : 'moved';
        return { t, st, skipped: skipped.has(t.id), why: st === 'moved' ? ((items.find((i) => i.t.id === t.id) || {}).a || {}).level <= 2 ? 'Now urgent — on its own' : 'Moved out of the batch' : '' };
      });
      const todo = rows.filter((r) => r.st === 'todo').sort((a, b) => a.skipped - b.skipped || live.ids.indexOf(a.t.id) - live.ids.indexOf(b.t.id));
      activeView = {
        key: active.key, label: live ? live.label : active.label || 'Batch', kind: live ? live.kind : active.kind, startedAt: active.startedAt,
        batch: live, rows, todo, done: rows.filter((r) => r.st === 'done').length, waiting: rows.filter((r) => r.st === 'waiting').length,
        total: rows.filter((r) => r.st !== 'cancelled').length, finished: !todo.length, memberIds: seenIds, paused: false,
      };
    }

    // DO NEXT: the first unit. For a batch, its first task (or the started batch's next task).
    let doNext = null;
    const top = units[0] || null;
    if (top) {
      const it = top.type === 'task' ? top.it : (top.active && activeView && activeView.todo[0] ? { ...top.batch.members.find((m) => m.t.id === activeView.todo[0].t.id) } : top.batch.members[0]);
      const t = it.t;
      const blockingQ = (t.questions || []).filter((q) => q.blocking && !q.answered);
      const mode = it.state === 'emergency' ? 'emergency' : blockingQ.length ? 'clarify' : it.state === 'followup' ? 'followup' : 'act';
      const why = it.a.reasons.slice(0, 3);
      if (it.batched) why.push(it.batched);
      if (top.type === 'batch') why.push(`${top.batch.reason} (${top.batch.members.length})`);
      if (activeView && !top.active) { activeView.paused = true; why.unshift(`Before continuing ${activeView.label}`); }
      doNext = { task: t, assessment: it.a, mode, why, action: mode === 'followup' ? (t.followUpAction || t.nextAction) : t.nextAction, questions: blockingQ, batch: top.type === 'batch' ? top.batch : null, unitKey: top.key };
    }
    const nextBatchUnit = units.find((u) => u.type === 'batch' && u !== top && !u.active) || null;
    const upNext = units.filter((u) => u !== top && u !== nextBatchUnit && !u.active);

    const shift = relevantShift(now, settings);
    const cur = shiftWindow(now, settings);
    const handoverAt = cur.state === 'on' ? cur.handover : shift.handover;
    const open = items.map((i) => i.t);
    const overdue = items.filter((i) => i.t.deadline && i.t.deadline < now && i.state !== 'later').sort((a, b) => a.t.deadline - b.t.deadline);
    const beforeHandover = items.filter((i) => (i.t.deadline && i.t.deadline <= handoverAt + MIN) || i.t.deadlineSource === 'handover').sort((a, b) => (a.t.deadline || 0) - (b.t.deadline || 0));
    const sinceMs = cur.state === 'on' ? cur.start : dayStart(now);
    const completedToday = tasks.filter((t) => t.status === 'completed' && t.completion && t.completion.at >= sinceMs).length;
    // workload vs time left: estimates only; the plan never schedules every minute
    let capacity = null;
    if (cur.state === 'on' && handoverAt > now) {
      const left = Math.round((handoverAt - now) / MIN);
      const work = Math.round(units.reduce((s, u) => s + (u.type === 'batch' ? u.batch.estMins : (u.it.t.estMins || 10)), 0));
      capacity = { minsLeft: left, workMins: work, tight: work > left * 0.7, over: work > left };
    }
    const memo = { order: units.map((u) => u.key), scores: Object.fromEntries(units.map((u) => [u.key, u.score])) };
    return {
      now, doNext,
      units, batches, nextBatch: nextBatchUnit ? nextBatchUnit.batch : null, upNext, active: activeView, memo, capacity,
      queue,
      emergencies: items.filter((i) => i.state === 'emergency'),
      waiting: items.filter((i) => i.state === 'waiting' || i.state === 'followup').sort((a, b) => (a.t.followUpAt || Infinity) - (b.t.followUpAt || Infinity)),
      blocked: items.filter((i) => i.state === 'blocked'),
      later: items.filter((i) => i.state === 'later').sort((a, b) => a.t.notBefore - b.t.notBefore),

      inbox: items.filter((i) => (i.t.questions || []).some((q) => q.blocking && !q.answered)),

        outstanding: open.length,
        overdue: overdue.length,
        blocked: items.filter((i) => i.state === 'blocked').length,
        waiting: items.filter((i) => i.state === 'waiting' || i.state === 'followup').length,

      shift: cur, nextShift: shift, handoverAt,
