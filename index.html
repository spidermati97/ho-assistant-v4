  }

  /** Patient-by-patient checklist for an MO update (never one merged message). Copy only — nothing is sent. */
  function moChecklist(batch, tasks, now) {
    const byBed = new Map();
    for (const it of batch.members) { const k = it.t.patientRef || 'No bed'; if (!byBed.has(k)) byBed.set(k, []); byBed.get(k).push(`- ${it.t.title}`); }
    for (const t of tasks) {
      if (!isOpen(t) || !t.patientRef || !byBed.has(t.patientRef)) continue;
      if (t.status === 'waiting' && ['inv_request', 'inv_followup', 'imaging_request', 'imaging_followup'].includes(t.category)) byBed.get(t.patientRef).push(`- Pending: ${t.title}`);
      if (t.status === 'waiting' && t.category === 'referral') byBed.get(t.patientRef).push(`- Referral pending: ${t.team || t.title}`);
    }
    const beds = [...byBed.keys()].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
    return [`MO update — ${fmtWhen(now, now)}`, ...beds.flatMap((b) => ['', b, ...byBed.get(b)])].join('\n');
  }
  /** Record a completion time for a kind (only when the user turned learning on). Times only, no patient details. */
  function learnBatchTime(prefs, kind, mins) {
    if (!(mins >= 1 && mins <= 90)) return prefs;
    prefs.times = prefs.times || {};
    prefs.times[kind] = [...(prefs.times[kind] || []), Math.round(mins)].slice(-12);
    return prefs;
  }
  function batchFeedback(prefs, kind, kindOfFeedback) {
    prefs.kinds = prefs.kinds || {};
    for (const k of String(kind).split('+')) {
      const p = prefs.kinds[k] = prefs.kinds[k] || { good: 0, poor: 0, off: false };
      if (kindOfFeedback === 'good') { p.good++; p.poor = Math.max(0, p.poor - 1); }
      if (kindOfFeedback === 'poor') p.poor++;
      if (kindOfFeedback === 'off') p.off = true;
      if (kindOfFeedback === 'on') { p.off = false; p.poor = 0; }
    }
    return prefs;
  }
  function batchMerge(prefs, a, b, on = true) {
    const pair = BATCH_MERGES.find((p) => p.includes(a) && p.includes(b));
    if (!pair) return prefs;
    prefs.merge = prefs.merge || {};
    prefs.merge[pair.join('+')] = on;
    return prefs;
  }

  // ───────────────────────── mutations ─────────────────────────
  function log(t, now, msg) { (t.log = t.log || []).push({ at: now, msg }); t.updatedAt = now; }

  function retemplate(t) {
    const x = { tests: t.tests || [], imaging: t.imaging || [], team: t.team, patient: t.patientRef, coreClean: clean(stripFiller(t.segment || t.title)), segment: t.segment || t.title, verbSource: stripFiller(clean(t.segment || t.title)), assignedBy: t.assignedBy, sub: t.sub };
    const T = template(t.category, t.sub, x);
    const e = t.edited || {};
    if (!e.title) t.title = T.title;
    if (!e.nextAction) t.nextAction = T.nextAction;
    if (!e.completionCriteria) t.completionCriteria = T.completion;
    if (!e.subtasks && !(t.subtasks || []).some((s) => s.done)) { t.subtasks = T.subtasks.map((s) => ({ id: uid(), text: s, done: false })); t.subtasksSuggested = T.subtasks.length > 0; }
    if (!e.estMins) t.estMins = estimate(t.category, x);
  }

  function answerQuestion(state, taskId, qid, value, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t) return null;
    const q = (t.questions || []).find((x) => x.id === qid);
    if (!q) return t;
    const s = state.settings;
    switch (q.field) {
      case 'patientRef': {
        const v = clean(value);
        if (!v) return t;
        const p = extractPatient(v);
        t.patientRef = p ? p.ref : v.slice(0, 24); t.patientSource = 'entered';
        break;
      }
      case 'team':
        t.team = clean(value).slice(0, 40); retemplate(t);
        s.recentTeams = [t.team, ...((s.recentTeams || []).filter((x) => x !== t.team))].slice(0, 6);
        break;
      case 'followupKind': {
        const map = {
          blood: () => { t.category = 'inv_followup'; t.tests = ['blood results']; },
          imaging: () => { t.category = 'imaging_followup'; t.imaging = ['imaging']; },
          referral: () => { t.category = 'referral'; t.sub = 'followup'; },
          senior: () => { t.category = 'communication'; t.sub = 'senior'; },
          other: () => { t.category = 'other'; },
        };
        (map[value] || map.other)();
        t.categoryConfidence = 'high';
        t.edited = { ...(t.edited || {}), title: false };
        retemplate(t);
        if (value === 'other') { t.title = 'Follow up'; t.questions.push({ id: uid(), field: 'title', blocking: false, q: 'What is it? (a few words)', answered: false }); }
        break;
      }
      case 'deadlineChoice':
        t.deadline = value == null || value === '' ? null : +value; t.deadlineConfirmed = true;
        t.deadlineSource = t.deadline ? (t.deadlineSource || 'user') : null;
        t.deadlineLabel = t.deadline ? `By ${fmtWhen(t.deadline, now)}` : '';
        break;
      case 'deadlineFree': {
        const tm = extractTiming(String(value || ''), { now, settings: s });
        if (tm.deadline) { t.deadline = tm.deadline; t.deadlineSource = 'user'; t.deadlineConfirmed = tm.deadlineConfirmed; t.deadlineLabel = tm.deadlineLabel; }
        break;
      }
      case 'labAction': case 'imgAction':
        t.category = value; t.categoryConfidence = 'high';
        if (t.tests && t.tests.length === 1 && t.tests[0] === 'bloods') t.edited = { ...(t.edited || {}), title: false };
        retemplate(t); break;
      case 'medAction': {
        const drug = ((t.segment || '').match(new RegExp(DRUG_RE.source, 'i')) || [])[0];
        const d = drug ? drug.toLowerCase() : 'medication';
        const map = { plan: `Clarify ${d} plan with MO`, chart: `Check ${d} on drug chart`, given: `Check ${d} was given`, recon: `Medication reconciliation${drug ? ` (${d})` : ''}` };
        t.title = map[value] || cap(clean(String(value))) || t.title;
        t.medKind = 'clear'; t.edited = { ...(t.edited || {}), title: true };
        t.nextAction = value === 'plan' ? 'Ask the prescriber what is intended and document the instruction.' : value === 'chart' ? 'Check the drug chart entry against the current plan; raise discrepancies with your MO.' : value === 'given' ? 'Check the administration record with the nurse.' : value === 'recon' ? 'Compare home medications with the current chart and list differences for your MO.' : t.nextAction;
        break;
      }
      case 'aiMissed':
        if (value === 'none') { t.status = 'cancelled'; t.cancelled = { at: now, reason: 'AI suggestion rejected' }; }
        t.aiMissed = false;
        break;
      case 'unresolved': {
        if (value === 'none') { t.status = 'cancelled'; t.cancelled = { at: now, reason: 'Marked “not a task”' }; t.unresolved = false; break; }
        const kinds = {
          blood: () => { t.category = 'inv_followup'; t.tests = ['bloods']; t.questions.push({ id: uid(), field: 'labAction', blocking: true, q: 'Bloods: take or check?', options: [{ label: 'Take / send now', value: 'inv_request' }, { label: 'Check results', value: 'inv_followup' }], answered: false }); },
          referral: () => { t.category = 'referral'; t.sub = 'make'; t.questions.push({ id: uid(), field: 'team', pick: 'team', blocking: true, q: 'Referral specialty?', options: teamList(s).map((o) => ({ label: o, value: o })), answered: false }); },
          review: () => { t.category = 'review'; },
          med: () => { t.category = 'medication'; t.medKind = 'unclear'; t.questions.push({ id: uid(), field: 'medAction', blocking: true, q: 'Medication: what needs doing?', options: [{ label: 'Clarify plan with MO', value: 'plan' }, { label: 'Check drug chart', value: 'chart' }, { label: 'Check it was given', value: 'given' }, { label: 'Med reconciliation', value: 'recon' }], allowOther: true, answered: false }); },
        };
        t.unresolved = false; t.categoryConfidence = 'high';
        if (kinds[value]) { kinds[value](); t.edited = { ...(t.edited || {}), title: false }; retemplate(t); }
        else { t.title = cap(clean(String(value))).slice(0, 110); t.edited = { ...(t.edited || {}), title: true }; t.category = 'other'; t.nextAction = t.title + '.'; }
        if (CATEGORIES[t.category].patient && !t.patientRef && !t.questions.some((q) => q.field === 'patientRef' && !q.answered)) t.questions.push({ id: uid(), field: 'patientRef', pick: 'patient', blocking: true, q: 'Which bed?', answered: false });
        break;
      }
      case 'followUp': {

    }
    q.answered = true; q.answer = typeof value === 'number' && value > 1e12 ? fmtWhen(value, now) : String(value ?? '');
    log(t, now, `Answered: ${q.q} → ${q.answer || '—'}`);
    const before = t.status;
    if (t.status !== 'cancelled') t.status = computeStatus(t);
    if (before !== t.status) t.statusSince = now;
    t.reminders = buildReminders(t, s, now, true, t.reminders);
    assignGroup(t, s);
    return t;
  }

  function setStatus(state, taskId, status, opts, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t || !STATUSES[status]) return { ok: false, error: 'Unknown task or status' };
    opts = opts || {};
    if ((status === 'waiting' || status === 'blocked') && !clean(opts.reason || t.waitReason)) return { ok: false, error: 'Say what it is waiting for, so you can follow it up.' };
    if (status === 'completed') return complete(state, taskId, { mode: 'completed', note: opts.note }, now);
    if (status === 'cancelled') {
      t.status = 'cancelled'; t.cancelled = { at: now, reason: clean(opts.reason) || null };
      log(t, now, 'Cancelled' + (opts.reason ? ': ' + opts.reason : ''));
      t.reminders = buildReminders(t, state.settings, now, true, t.reminders);
      return { ok: true, task: t };
    }
    t.manualWaiting = status === 'waiting'; t.manualBlocked = status === 'blocked';
    if (status === 'waiting' || status === 'blocked') {
      t.waitReason = clean(opts.reason || t.waitReason);
      if (opts.followUpAction !== undefined) t.followUpAction = clean(opts.followUpAction) || null;
      if (opts.followUpAt !== undefined) t.followUpAt = opts.followUpAt || null;

      t.waitingCleared = true;

    }
    const prev = t.status;
    t.status = status;
    if (status === 'ready' || status === 'in_progress') {
      // a task with unmet prerequisites cannot be made ready by accident
      const computed = computeStatus({ ...t, status: status });
      if (computed === 'blocked' || computed === 'waiting') t.status = computed;
    }
    if (prev !== t.status) { t.statusSince = now; log(t, now, `Status: ${STATUSES[prev]} → ${STATUSES[t.status]}${t.waitReason && (t.status === 'waiting' || t.status === 'blocked') ? ' (' + t.waitReason + ')' : ''}`); }
    t.reminders = buildReminders(t, state.settings, now, true, t.reminders);
    return { ok: true, task: t };
  }

  const AWAIT_TEMPLATES = {
    inv_request: (t) => ({ reason: `Awaiting ${listJoin(t.tests) || 'result'} result`, action: `Check ${listJoin(t.tests) || 'the'} result`, mins: 120 }),
    imaging_request: (t) => ({ reason: `Awaiting ${listJoin(t.imaging) || 'scan'} to be done and reported`, action: `Check whether the ${listJoin(t.imaging) || 'scan'} is done and reported`, mins: 180 }),
    referral: (t) => ({ reason: `Awaiting ${t.team || 'team'} review`, action: `Check whether ${t.team || 'the team'} has reviewed`, mins: 240 }),
    communication: () => ({ reason: 'Awaiting a reply or call back', action: 'Chase the reply if no call back', mins: 60 }),
    imaging_followup: () => ({ reason: 'Report not out yet', action: 'Check the report again', mins: 60 }),
    inv_followup: () => ({ reason: 'Result not out yet', action: 'Check the result again', mins: 60 }),
  };
  function awaitingSuggestion(t) {
    const f = AWAIT_TEMPLATES[t.category];
    return f ? f(t) : { reason: 'Awaiting the outcome', action: 'Check the outcome', mins: 60 };
  }

  /**
   * complete(state, id, {mode:'completed'|'action_done', note, followUpMins}, now)
   * 'action_done' = the action is done but the outcome is still pending → Waiting, never Completed.
   */
  function complete(state, taskId, opts, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t) return { ok: false, error: 'Task not found' };
    opts = opts || {};
    const changed = [t.id];
    let spawned = null;
    if (opts.mode === 'action_done') {
      const sug = awaitingSuggestion(t);
      t.actionDoneAt = now;
      t.manualWaiting = true; t.waitingCleared = false;
      t.status = 'waiting'; t.statusSince = now;
      t.waitReason = clean(opts.reason) || sug.reason;
      t.followUpAction = clean(opts.followUpAction) || sug.action;
      const mins = opts.followUpMins === null ? null : (opts.followUpMins ?? sug.mins);
      t.followUpAt = mins ? now + mins * MIN : null;
      log(t, now, `Action done; outcome still pending (${t.waitReason})${opts.note ? ' — ' + opts.note : ''}`);

    log(t, now, 'Marked complete by you' + (opts.note ? ' — ' + opts.note : ''));
    t.reminders = buildReminders(t, state.settings, now, true, t.reminders);

    for (const other of state.tasks) {

      let touched = false;
      for (const p of other.prereqs || []) {
        if (p.kind === 'task' && p.taskId === t.id && !p.met) { p.met = true; p.metAt = now; p.metNote = 'Linked task marked complete'; touched = true; }

        if (other.status !== before) other.statusSince = now;
        log(other, now, `Prerequisite “${t.title}” completed — now ${STATUSES[other.status]}`);
        other.reminders = buildReminders(other, state.settings, now, true, other.reminders);
        changed.push(other.id);
      }
    }

      spawned = cloneForRecurrence(t, base + t.recurrence.everyMins * MIN, now, state.settings);

  }

  function cloneForRecurrence(t, nextDue, now, settings) {
    const n = JSON.parse(JSON.stringify(t));
    n.id = uid(); n.createdAt = now; n.updatedAt = now; n.status = 'ready'; n.statusSince = now;
    n.completion = null; n.actionDoneAt = null; n.cancelled = null; n.deferCount = 0; n.escalationFiredAt = null;
    n.deadline = nextDue; n.deadlineSource = 'recurrence'; n.deadlineConfirmed = true; n.deadlineLabel = `${t.recurrence.label} — next at ${fmtWhen(nextDue, now)}`;
    n.notBefore = null; n.subtasks = (n.subtasks || []).map((s) => ({ ...s, id: uid(), done: false }));

    n.log = [{ at: now, msg: `Created from recurring task (${t.recurrence.label})` }];
    n.recurrenceOf = t.recurrenceOf || t.id;
    n.reminders = buildReminders(n, settings, now, true, []);
    return n;
  }

  function reopen(state, taskId, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t) return null;
    t.status = 'ready'; t.completion = null; t.cancelled = null; t.statusSince = now; t.manualWaiting = false; t.manualBlocked = false; t.waitingCleared = true;
    t.status = computeStatus(t);
    log(t, now, 'Reopened');
    t.reminders = buildReminders(t, state.settings, now, true, t.reminders);
    return t;
  }

  function defer(state, taskId, mins, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t) return null;
    t.deferCount = (t.deferCount || 0) + 1;
    t.notBefore = now + mins * MIN; t.notBeforeLabel = `Deferred until ${fmtTime(t.notBefore)}`;
    log(t, now, `Deferred ${fmtDur(mins)} (${t.deferCount}×)`);
    if (t.flags && t.flags.emergency && !t.emergencyResolved) { t.notBefore = null; log(t, now, 'Not deferred: possible emergency stays at the top until you resolve it'); }
    return t;
  }

  function setPrereqMet(state, taskId, prereqId, met, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t) return null;
    const p = (t.prereqs || []).find((x) => x.id === prereqId);
    if (!p) return t;

    if (t.status !== before) t.statusSince = now;
    log(t, now, `Prerequisite “${p.text}” ${met ? 'marked met' : 'marked not met'} — now ${STATUSES[t.status]}`);
    t.reminders = buildReminders(t, state.settings, now, true, t.reminders);
    return t;
  }

  function resolveEmergency(state, taskId, reason, now) {
    const t = state.tasks.find((x) => x.id === taskId);
    if (!t || !clean(reason)) return { ok: false, error: 'Add a short reason, e.g. “Assessed by MO, stable”.' };

    if (st.ids.length > 1 && !st.confirmed) return true; // a multi-task entry waits for “Confirm all” or close
    if (st.audit && (st.audit.warnings || []).some((w) => w.type === 'merge' && task(w.taskId))) return true;
    return st.ids.map(task).filter(Boolean).some((t) => blockingQ(t) || (t.possibleDuplicateOf && !t.dupResolved && task(t.possibleDuplicateOf)) || (isAssumed(t) && !t.assumptionsConfirmed) || (t.flags && t.flags.emergency && !t.emergencyResolved));
  }
  let stripTimer = null;
  function scheduleStripHide() {
    clearTimeout(stripTimer);
    const st = ui.strip;
    stripTimer = setTimeout(() => {
      if (ui.strip === st && !stripNeedsAttention(st) && !ui.stripHold) { ui.strip = null; renderStrip(); }
    }, 7000);
  }

  // ───────────── AI (optional) ─────────────
  async function callEndpoint(prompt) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    let res;
    try {
      res = await fetch(S.settings.aiEndpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt }), signal: ctl.signal });
    } catch (e) {
      throw { code: ctl.signal.aborted ? 'timeout' : navigator.onLine ? 'network' : 'offline' };
    } finally { clearTimeout(timer); }
    if (!res.ok) throw { code: 'http', status: res.status };
    let data;
    try { data = await res.json(); } catch (e) { throw { code: 'invalid' }; }
    if (Array.isArray(data) || (data && Array.isArray(data.items))) return data;
    const txt = String((data && data.text) || '');
    const m = /\{[\s\S]*\}/.exec(txt) || /\[[\s\S]*\]/.exec(txt);
    if (!m) throw { code: 'invalid' };
    try { return JSON.parse(m[0]); } catch (e) { throw { code: 'invalid' }; }
  }
  const AI_ERRORS = {
    offline: 'Offline — rules only', network: 'AI unreachable — rules only', timeout: 'AI too slow — rules only',
    http: 'AI error — rules only', invalid: 'AI reply unusable — rules only', rate_limited: 'AI busy — rules only', not_granted: 'AI not allowed — rules only',
  };
  /**
   * AI second check: refines wording and looks for tasks the rules missed. All-or-nothing:
   * an unusable reply leaves the rules list exactly as it was, and the strip says the check failed.
   */
  async function aiRefine(ids, input, captureId) {
    const drafts = ids.map(task).filter(Boolean);
    const cap = captureById(captureId);
    const mine = () => ui.strip && ui.strip.captureId === captureId;
    try {
      const prompt = E.aiPrompt(drafts, input);
      const raw = aiMode() === 'sample' ? await ui.caps.sample.json(prompt, { modelTier: 'quick' }) : await callEndpoint(prompt);
      const v = E.validateAIResponse(raw, drafts, input);
      if (!v.ok) throw { code: 'invalid' };
      const n = now();
      drafts.forEach((d, i) => { if (v.items[i]) { E.mergeAI(d, v.items[i], n); d.status = E.computeStatus(d); } });
      const added = v.missed.length ? E.draftsFromMissed(v.missed, input, { now: n, settings: S.settings }) : [];
      added.forEach(applyLocalWorkflow);
      for (const d of added) S.tasks.push(d);
      if (cap) { cap.taskIds.push(...added.map((d) => d.id)); cap.ai = added.length ? `AI check: ${added.length} possible missed` : 'AI check: nothing missed'; }
      if (mine()) { ui.strip.ids.push(...added.map((d) => d.id)); ui.strip.ai = 'done'; ui.strip.aiMissed = added.length; }
      commit();
    } catch (e) {
      const code = e && e.code;
      if (cap) cap.ai = 'AI check failed — rules only';
      if (mine()) { ui.strip.ai = 'error'; ui.strip.aiMsg = (AI_ERRORS[code] || AI_ERRORS.invalid) + (code === 'http' && e.status ? ` (${e.status})` : ''); }
      save(); render();
    }
  }

  // ───────────── reminders & notifications ─────────────
  function tick() {
    const n = now();
    const alerts = E.dueAlerts(S, n);
    const fresh = [];
    for (const a of alerts) {
      if (!ui.alerts.some((x) => x.key === a.key)) { const x = { ...a, shownAt: n }; ui.alerts.push(x); fresh.push(x); }
      E.markAlertFired(S, a, n);
    }
    if (alerts.length) save();
    if (fresh.length) { try { navigator.vibrate && navigator.vibrate(150); } catch (e) { /* not available */ } }
    if (fresh.length && S.settings.notify && !IS_ARTIFACT) notifyAlerts(fresh);
    const active = document.activeElement;
    const typing = active && /INPUT|TEXTAREA|SELECT/.test(active.tagName) && !['capture-input'].includes(active.id);
    if (!typing && ui.voice.state !== 'listening') render(); else { renderAlerts(); renderBar(); }
  }
  function notifPermission() { return 'Notification' in window ? Notification.permission : 'unsupported'; }
  async function swRegistration() {
    if (ui.swReg) return ui.swReg;
    try { return navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null; } catch (e) { return null; }
  }
  async function notifyAlerts(list, forceDetails) {
    if (notifPermission() !== 'granted') return 0;
    const reg = await swRegistration();
    let ok = 0;
    for (const a of list) {
      const title = `${KIND_LABEL[a.kind] || 'Reminder'} · ${E.fmtTime(a.at)}`;
      const body = S.settings.notifyDetails || forceDetails ? a.text : 'A task needs attention. Open HO Assistant.';
      const opts = { body, tag: a.key, data: { taskId: a.taskId || null }, icon: 'icon-192.png', badge: 'favicon.png', renotify: true, requireInteraction: a.kind === 'escalation' };
      try { if (reg) await reg.showNotification(title, opts); else new Notification(title, opts); ok++; } catch (e) { /* refused */ }
    }
    return ok;
  }

  // ───────────── voice ─────────────
  const voiceSupported = () => !IS_ARTIFACT && !!SR;
  function startVoice(mode) {
    if (!voiceSupported()) { ui.menu = { kind: 'voice-help' }; render(); return; }
    if (!navigator.onLine) { toast('Voice needs internet. Type instead — tasks still save offline.', 'warn', 5000); return; }
    if (!S.settings.voiceAck) { ui.menu = { kind: 'voice-intro', mode }; render(); return; }
    let rec;
    try { rec = new SR(); } catch (e) { toast('Voice could not start on this phone.', 'warn'); return; }
    rec.lang = ui.voiceLangOverride || S.settings.voiceLang || 'en-MY';
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.continuous = mode === 'note';
    const v = { state: 'listening', mode, interim: '', finals: [], alts: [], conf: null, rec, startedAt: now(), bed: currentCtxBed() };
    ui.voice = v;
    if (!ui.captureStart) ui.captureStart = now();
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          v.finals.push(String(r[0].transcript || '').trim());
          const c = typeof r[0].confidence === 'number' ? r[0].confidence : null;
          if (c != null && c > 0) v.conf = v.conf == null ? c : Math.min(v.conf, c);
          for (let j = 1; j < r.length; j++) v.alts.push(String(r[j].transcript || '').trim());
        } else interim += r[0].transcript;
      }
      v.interim = interim;
      renderVoicebar();
    };
    rec.onerror = (e) => {
      const code = e && e.error;
      if (code === 'language-not-supported' && !ui.voiceLangOverride) { ui.voiceLangOverride = 'en-GB'; v.retry = true; return; }
      v.err = code;
    };
    rec.onend = () => {
      if (v.retry) { ui.voice = { state: 'idle' }; startVoice(mode); return; }
      if (v.cancelled) { ui.voice = { state: 'idle' }; render(); return; }
      finishVoice(v);
    };
    try { rec.start(); } catch (e) { toast('Voice could not start. Try again.', 'warn'); ui.voice = { state: 'idle' }; }
    render();
  }
  const VOICE_ERRORS = {
    'not-allowed': 'Microphone blocked. Allow it: long-press the app icon → App info → Permissions → Microphone.',
    'service-not-allowed': 'Microphone blocked for this app.',
    network: 'Voice needs internet. Type instead — tasks still save offline.',
    'no-speech': 'Didn’t hear anything. Try again closer to the phone.',
    'audio-capture': 'No microphone found.',
  };
  function finishVoice(v) {
    const text = (v.finals.join(' ') + ' ' + (v.finals.length ? '' : v.interim)).replace(/\s+/g, ' ').trim();
    ui.voice = { state: 'idle' };
    if (v.err && v.err !== 'aborted' && !text) { toast(VOICE_ERRORS[v.err] || 'Voice stopped unexpectedly. Type instead.', 'warn', 6000); render(); return; }
    if (!text) { toast('Didn’t catch anything.', 'warn'); render(); return; }
    if (v.mode === 'note') { createNote(text, 'voice', v.bed); return; }
    const field = $('#capture-input');
    const before = field.value.trim();
    field.value = before ? before + ' ' + text : text;
    ui.voiceMeta = { transcript: field.value, alts: v.alts, conf: v.conf, flags: E.reviewFlags(text), low: v.conf != null && v.conf < 0.7 };
    autoGrow(field); syncCaptureButtons(); render();
    field.focus();
  }

  // ───────────── notes (clinical dictation drafts) ─────────────
  function createNote(text, source, bed) {
    const n = now();
    const st = E.structureNote(text);
    const nt = { id: E.uid(), patientRef: bed || null, transcript: text, draft: E.noteDraftText(st), candidates: st.candidates.map((c) => ({ text: c, picked: false })), flags: st.flags, status: 'draft', source, createdAt: n, updatedAt: n, tasksCreated: [] };
    S.notes = S.notes || [];

  // ───────────── render: shell ─────────────

  function renderBar() {

  // ───────────── capture strip (compact confirmation) ─────────────
  function renderStrip() {

    host.hidden = false;
    const n = now();
    // one question at a time across the batch
    let qTask = null, qq = null, remaining = 0;
    for (const t of tasks) { for (const q of openQs(t).filter((x) => x.blocking)) { if (!qq) { qTask = t; qq = q; } else remaining++; } }
    const live = tasks.filter((t) => t.status !== 'cancelled');
    const multi = st.ids.length > 1;
    const byBed = new Map();
    for (const t of live) byBed.set(t.patientRef || '', (byBed.get(t.patientRef || '') || 0) + 1);
    const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
    let summary;
    if (!multi) summary = 'Saved';
    else if (byBed.size === 1) { const [b] = [...byBed.keys()]; summary = `${b ? esc(b) + ' — ' : ''}${plural(live.length, 'task')} captured`; }
    else summary = `${plural(live.length, 'task')} captured`;
    const head = st.saved
      ? `<span class="ok">${ICON(IC.check, 16, 2.6)} ${summary}</span>`
      : '<span class="bad">Not saved — storage blocked</span>';
    const aiTxt = st.ai === 'running' ? 'AI checking…' : st.ai === 'done' ? (st.aiMissed ? `AI found ${plural(st.aiMissed, 'possible missed item')} — confirm below` : 'AI check: nothing missed') : st.ai === 'error' || st.ai === 'offline' ? `${st.aiMsg || 'Offline — rules only'}. Check the list against your note.` : '';
    const need = live.filter((t) => blockingQ(t)).length;
    const audit = st.audit || {};
    const bits = [];
    if (multi && byBed.size > 1) bits.push([...byBed.entries()].map(([b, k]) => `${b ? esc(b) : 'no bed'} ${k}`).join(' · '));

    if (need) bits.push(`<b class="needq">${plural(need, 'item')} need${need === 1 ? 's' : ''} clarification</b>`);

      <ul class="cap-list">${tasks.map((t) => {
        const dup = t.possibleDuplicateOf && !t.dupResolved && task(t.possibleDuplicateOf);
        const assumed = isAssumed(t) && !t.assumptionsConfirmed && !blockingQ(t);
        const merge = merges.find((w) => w.taskId === t.id);
        if (t.status === 'cancelled') return `<li class="cap gone"><div class="cap-line"><span class="cap-bed"></span><span class="cap-title"><s>${esc(t.title)}</s> <span class="muted small">not a task</span></span></div></li>`;
        return `<li class="cap${t.flags && t.flags.emergency ? ' em' : ''}${t.unresolved ? ' unres' : ''}">
          <div class="cap-line">
            <span class="cap-bed">${t.patientRef ? (byBed.size === 1 && multi ? '' : bedTag(t.patientRef)) : (needsPatient(t) || t.unresolved ? '<span class="bed missing">no bed</span>' : '')}</span>
            <span class="cap-chips">${catChip(t, 'button')}${priChip(t, E.assess(t, { now: n, settings: S.settings }), 'button')}</span>
            <button class="cap-title" data-act="open" data-id="${t.id}">${t.aiMissed || t.source === 'ai-missed' ? '<span class="tag-ai">AI</span> ' : ''}${esc(t.title)}${t.flags && t.flags.urgent && !t.flags.emergency ? ' <span class="urg">urgent</span>' : ''}${t.deadline ? ` <span class="cap-due">${dueChip(t, n)}</span>` : ''}</button>
            ${assumed ? `<button class="mini" data-act="confirm-assumed" data-id="${t.id}">Confirm</button>` : ''}
            <button class="mini" data-act="open" data-id="${t.id}">Edit</button>
            <button class="mini ghost" data-act="undo-capture" data-id="${t.id}">Undo</button>
          </div>
          ${t.flags && t.flags.emergency ? '<p class="cap-alert">Possible emergency — get help at the bedside now.</p>' : ''}
          ${merge ? `<div class="cap-dup">${esc(merge.msg)}${merge.at != null ? ` <button class="mini" data-act="split-task" data-id="${t.id}" data-at="${merge.at}">Split</button>` : ''}<button class="mini ghost" data-act="merge-ok" data-id="${t.id}">It’s one</button></div>` : ''}
          ${dup ? `<div class="cap-dup">Possible duplicate of ${bedTag(dup.patientRef)} ${esc(dup.title)} <button class="mini" data-act="dup-keep" data-id="${t.id}">Keep both</button><button class="mini" data-act="dup-remove" data-id="${t.id}">Remove new</button></div>` : ''}
          ${qTask === t ? clarifyUI(t, qq, 'strip') : ''}
        </li>`;
      }).join('')}</ul>
      ${remaining ? `<p class="strip-foot">${remaining} more question${remaining > 1 ? 's' : ''} after this</p>` : ''}
      ${multi || st.ai === 'error' ? `<div class="strip-actions">${multi && !st.confirmed ? '<button class="primary" data-act="confirm-all">Confirm all</button>' : ''}<button data-act="compare" data-cap="${esc(st.captureId || '')}">Review against my note</button></div>` : ''}
    </div>`);
  }

  // ───────────── screens ─────────────
  function renderMain() {
    const n = now();
    const p = getPlan(n, true);
    const fn = { next: screenNext, beds: screenBeds, bed: screenBed, waiting: screenWaiting, handover: screenHandover, more: screenMore, tasks: screenTasks, schedule: screenSchedule, done: screenDone, notes: screenNotes, settings: screenSettings, recent: screenRecent }[ui.tab] || screenNext;
    setHTML($('#main'), `<div class="screen screen-${ui.tab}">${fn(p, n)}</div>`);
    if (ui.focusSearch) { const s = $('#search-input'); if (s) s.focus(); ui.focusSearch = false; }
  }

  function emergencyBand(p, n) {
    if (!p.emergencies.length) return '';
    const note = S.settings.emergencyNote;
    return p.emergencies.map(({ t }) => `
      <section class="emergency" role="alert">
        <p class="em-head">${ICON('M12 4l9 16H3zM12 10v4M12 17h.01', 20, 2.2)} Possible emergency ${t.patientRef ? `· ${esc(t.patientRef)}` : ''}</p>
        <p class="em-quote">“${esc(t.segment)}”</p>
        <p class="em-do">Get help at the bedside now. Escalate per your hospital’s emergency process.</p>
        ${note ? `<p class="em-note">${esc(note)}</p>` : ''}
        <div class="em-actions"><button data-act="em-resolve" data-id="${t.id}">Handled — clear</button><button class="em-ghost" data-act="open" data-id="${t.id}">Details</button></div>
      </section>`).join('');
  }

  /** One short line per batch member: bed — what. */
  function memberLine(t) {
    const what = t.category === 'referral' ? (t.team || 'specialty?') + (t.sub === 'followup' ? ' reply' : '')
      : ['inv_request', 'inv_followup'].includes(t.category) && (t.tests || []).length ? E.listJoin(t.tests)
        : ['imaging_request', 'imaging_followup'].includes(t.category) && (t.imaging || []).length ? E.listJoin(t.imaging) : t.title;
    return what;
  }
  const estLabel = (m) => `~${E.fmtDur(m)} (estimate)`;
  function nextCard(p, n) {
    const d = p.doNext;
    if (!d) {
      const w = p.waiting.length + p.blocked.length;
      return `<section class="next-card empty"><p class="eyebrow">Do next</p><p class="next-title">Nothing to do right now</p>${w ? `<button class="linkish" data-act="go" data-tab="waiting">${w} waiting</button>` : ''}</section>`;
    }
    if (d.mode === 'emergency') return '';
    const t = d.task, a = d.assessment;
    const q = d.mode === 'clarify' ? d.questions[0] : null;
    const reason = p.active && p.active.paused ? `Before continuing ${p.active.label}` : E.shortReason(t, a, n);
    const act = p.active && !p.active.paused ? p.active : null;
    const inBatch = act ? `<p class="next-batch">${ICON(IC.stack, 16)} ${esc(act.label)} · ${act.done + act.waiting + 1} of ${act.total} <button class="linkish" data-act="batch-open" data-key="${esc(act.key)}">List</button>${act.todo.length > 1 ? `<button class="linkish" data-act="bk-skip" data-id="${t.id}">Skip</button>` : ''}</p>`
      : d.batch ? `<p class="next-batch">${ICON(IC.stack, 16)} 1 of ${d.batch.members.length} in ${esc(d.batch.label)} <button class="linkish" data-act="batch-start" data-key="${esc(d.batch.key)}">Start batch</button><button class="linkish" data-act="batch-open" data-key="${esc(d.batch.key)}">View</button></p>` : '';
    return `<section class="next-card lv${a.level}">
      <p class="eyebrow">Do next</p>
      <button class="next-main" data-act="open" data-id="${t.id}">${bedTag(t.patientRef, 'lg')}<span class="next-title">${d.mode === 'followup' ? 'Re-check: ' : ''}${esc(t.title)}</span></button>
      <p class="next-why">${catChip(t, 'button')}${priChip(t, a, 'button')}${reason ? `<span>${esc(reason)}</span>` : ''}</p>
      ${a.level === 1 && d.mode !== 'emergency' ? '<p class="next-esc">Immediate: follow your hospital’s escalation process and get senior help now.</p>' : ''}
      ${inBatch}
      ${q ? clarifyUI(t, q, 'next') : `<div class="next-actions">
        <button class="primary" data-act="done" data-id="${t.id}">${ICON(IC.check, 20, 2.4)} ${d.mode === 'followup' ? 'Result in' : 'Done'}</button>
        <button data-act="defer-menu" data-id="${t.id}">Later</button>
        <button class="icon-only" data-act="open" data-id="${t.id}" aria-label="Details">${ICON(IC.chev, 20)}</button>
      </div>`}
    </section>`;
  }
  function batchCard(b, eyebrow) {
    const show = b.members.slice(0, 4);
    return `<section class="batch-card">
      <p class="eyebrow">${eyebrow}</p>
      <button class="batch-main" data-act="batch-open" data-key="${esc(b.key)}"><span class="batch-title">${ICON(IC.stack, 18)} ${esc(b.label)} — ${b.members.length} tasks</span><span class="muted small">${estLabel(b.estMins)}</span></button>
      <ul class="batch-lines">${show.map((it) => `<li>${bedTag(it.t.patientRef)}${priChip(it.t, it.a)}<span>${esc(memberLine(it.t))}</span>${it.t.deadline ? ` <span class="cap-due">${dueChip(it.t, now())}</span>` : ''}${blockingQ(it.t) ? ' <span class="qmark">?</span>' : ''}</li>`).join('')}${b.members.length > show.length ? `<li class="muted">+${b.members.length - show.length} more</li>` : ''}</ul>
      <div class="batch-actions"><button class="primary" data-act="batch-start" data-key="${esc(b.key)}">Start</button><button data-act="batch-open" data-key="${esc(b.key)}">View</button></div>
    </section>`;
  }
  function activeCard(p) {
    const a = p.active;
    if (!a || a.finished) return '';
    if (!a.paused) return ''; // the Do next card already shows the next task of the batch
    return `<section class="batch-card paused"><p class="eyebrow">Paused</p>
      <button class="batch-main" data-act="batch-open" data-key="${esc(a.key)}"><span class="batch-title">${ICON(IC.stack, 18)} ${esc(a.label)}</span><span class="muted small">${a.done} done${a.waiting ? ` · ${a.waiting} waiting` : ''} · ${a.todo.length} to go · urgent work first</span></button></section>`;
  }
  function unitRow(u, n) {
    if (u.type === 'task') return row(u.it.t, u.it, n);
    const b = u.batch;
    return `<button class="row batch-row" data-act="batch-open" data-key="${esc(b.key)}">
      <span class="row-bed">${ICON(IC.stack, 18)}</span>
      <span class="row-title">${esc(b.label)} — ${b.members.length} tasks</span>
      <span class="row-right"><span class="muted small">~${E.fmtDur(b.estMins)}</span>${b.deadline ? dueChip(b.members[0].t, n) : ''}</span>
    </button>`;
  }

  function screenNext(p, n) {
    const shown = new Set();
    if (p.doNext) shown.add(p.doNext.task.id);
    const showBatch = p.nextBatch && !(p.doNext && p.doNext.batch && p.doNext.batch.key === p.nextBatch.key) ? p.nextBatch : null;
    const up = p.upNext.filter((u) => !(u.type === 'task' && (blockingQ(u.it.t) || shown.has(u.it.t.id)))).slice(0, 5);
    const review = p.inbox.filter((it) => !shown.has(it.t.id) && !p.batches.some((b) => b.ids.includes(it.t.id)));
    const followDue = p.waiting.filter((i) => i.state === 'followup').length;
    const waitN = p.waiting.length + p.blocked.length;
    const hoN = p.beforeHandover.length;
    const demo = S.tasks.filter((t) => t.isDemo).length;
    const restCount = p.upNext.length - up.length - review.length;
    const c = p.capacity;
    return `
      ${emergencyBand(p, n)}
      ${nextCard(p, n)}
      ${activeCard(p)}
      ${showBatch && !p.emergencies.length ? batchCard(showBatch, 'Next batch') : ''}
      ${up.length ? `<section class="list"><h2 class="lh">Up next</h2><div class="rows">${up.map((u) => unitRow(u, n)).join('')}</div>${restCount > 0 ? `<button class="linkish more-link" data-act="go" data-tab="tasks">${restCount} more</button>` : ''}</section>` : ''}
      ${review.length ? `<section class="list"><h2 class="lh">Needs a detail <span class="count">${review.length}</span></h2><div class="rows">${review.slice(0, 4).map((it) => row(it.t, it, n)).join('')}</div></section>` : ''}
      <nav class="quick">
        <button data-act="go" data-tab="waiting">${ICON(IC.clock, 18)} Waiting <b>${waitN}</b>${followDue ? ` <span class="due-now">${followDue} due</span>` : ''}</button>
        <button data-act="go" data-tab="handover">Before handover <b>${hoN}</b></button>
        ${p.later.length ? `<button data-act="go" data-tab="schedule">Later <b>${p.later.length}</b></button>` : ''}
      </nav>
      ${c && c.workMins ? `<p class="capacity${c.tight ? ' tight' : ''}">${c.tight ? '<b>Tight.</b> ' : ''}~${E.fmtDur(c.workMins)} of listed work (estimate) · ${E.fmtDur(c.minsLeft)} to handover${c.tight ? '. Leave room for new work; hand over what can wait.' : ''}</p>` : ''}
      ${demo ? `<p class="demo-line">Showing ${demo} demo tasks (made-up beds). <button class="linkish" data-act="clear-demo">Remove</button></p>` : ''}`;
  }

  // ───────────── batch sheet (a temporary checklist over existing tasks) ─────────────
  function renderBatchSheet(host) {
    const n = now();
    const p = getPlan(n);
    const act = p.active && p.active.key === ui.batchKey ? p.active : null;
    const b = (act && act.batch) || p.batches.find((x) => x.key === ui.batchKey);
    if (!b && !act) { ui.batchKey = null; host.hidden = true; host.innerHTML = ''; document.body.classList.remove('sheet-open'); return; }
    host.hidden = false;
    document.body.classList.add('sheet-open');
    const kind = (b || act).kind;
    const label = (act && act.label) || b.label;
    const rows = act ? act.rows : b.members.map((it) => ({ t: it.t, st: 'todo' }));
    const ordered = act ? [...act.todo, ...rows.filter((r) => r.st !== 'todo')] : rows;
    const sub = (t) => {
      const bits = [];
      if (t.category === 'referral' && t.sub !== 'followup') { const ch = E.teamChannel(S.settings, t.team); bits.push(t.team ? (ch ? `Channel: ${ch}` : 'Channel not set') : 'Specialty not given'); }
      const unmet = (t.prereqs || []).filter((x) => !x.met);
      if (unmet.length) bits.push(`Needs: ${unmet.map((x) => x.text).join('; ')}`);
      const q = blockingQ(t); if (q) bits.push(q.q);
      return bits.map(esc).join(' · ');
    };
    const stLabel = { done: 'done', waiting: 'waiting', moved: '', cancelled: 'cancelled' };
    const li = (r) => {
      const t = r.t;
      const closed = r.st === 'done' || r.st === 'cancelled';
      return `<li class="bk-row st-${r.st}${r.skipped ? ' skipped' : ''}">
        <button class="bk-check" data-act="${closed ? 'noop' : r.st === 'waiting' ? 'outcome-in' : 'done'}" data-id="${t.id}" aria-label="${closed ? 'Done' : 'Mark done'}">${closed ? ICON(IC.check, 18, 2.6) : ''}</button>
        <div class="bk-main">
          <button class="bk-title" data-act="open" data-id="${t.id}">${bedTag(t.patientRef)}${catChip(t)}${priChip(t, E.isOpen(t) ? E.assess(t, { now: n, settings: S.settings }) : null)}${esc(t.title)}${t.deadline && E.isOpen(t) ? ` ${dueChip(t, n)}` : ''}</button>
          ${r.st === 'todo' ? `<p class="bk-sub">${sub(t) || esc(t.nextAction || '')}</p>` : `<p class="bk-sub">${esc(r.why || stLabel[r.st] || '')}${r.st === 'waiting' ? esc(t.waitReason ? ` — ${t.waitReason}` : '') : ''}</p>`}
          ${r.st === 'todo' ? `<div class="bk-acts">${act ? `<button class="mini" data-act="bk-skip" data-id="${t.id}">${r.skipped ? 'Skipped' : 'Skip'}</button>` : ''}<button class="mini" data-act="wait-menu" data-id="${t.id}">Waiting…</button><button class="mini ghost" data-act="bk-sep" data-id="${t.id}">Keep separate</button></div>` : ''}
        </div>
      </li>`;
    };
    const notIn = b ? b.notIn : [];
    const mergeTargets = b ? (b.mergeWith || []).filter((k) => p.batches.some((x) => x.kind === k)) : [];
    setHTML(host, `<div class="sheet-inner">
      <header class="sheet-head"><button class="icon-btn" data-act="batch-close" aria-label="Back">${ICON(IC.back)}</button><span class="sh-status">${ICON(IC.stack, 16)} ${esc(label)}</span></header>
      <div class="sheet-body" data-scroll>
        <p class="bk-head">${act ? `${act.done} done${act.waiting ? ` · ${act.waiting} waiting` : ''} · ${act.todo.length} to go` : `${b.members.length} tasks`}${b ? ` · ${estLabel(b.estMins)}` : ''}</p>
        ${b ? `<p class="hint">${esc(b.reason)}.${b.note ? ' ' + esc(b.note) : ''}</p>` : ''}
        <ul class="bk-list">${ordered.map(li).join('')}</ul>
        ${kind === 'mo_update' && b ? `<button class="wide" data-act="bk-copy" data-key="${esc(b.key)}">${ICON(IC.copy, 18)} Copy as checklist (by patient)</button><p class="hint">Copies text only. Nothing is sent.</p>` : ''}
        ${notIn.length ? `<details class="d-sec"${ui.openSecs.has('bk-notin') ? ' open' : ''} data-sec="bk-notin"><summary>Not in this batch <span class="count">${notIn.length}</span></summary><div class="d-body"><ul class="plain">${notIn.map((x) => `<li>${bedTag(x.t.patientRef)} <button class="linkish" data-act="open" data-id="${x.t.id}">${esc(x.t.title)}</button> <span class="muted small">${esc(x.why)}</span>${x.soft ? ` <button class="mini" data-act="bk-back" data-id="${x.t.id}">Put back</button>` : ''}</li>`).join('')}</ul></div></details>` : ''}
        <div class="bk-fb">
          <span class="muted small">This grouping:</span>
          <button class="mini" data-act="bk-fb" data-kind="${esc(kind)}" data-v="good">Good batch</button>
          <button class="mini" data-act="bk-fb" data-kind="${esc(kind)}" data-v="poor">Poor batch</button>
          <button class="mini ghost" data-act="bk-fb" data-kind="${esc(kind)}" data-v="off">Don’t suggest again</button>
          ${mergeTargets.map((k) => `<button class="mini ghost" data-act="bk-merge" data-a="${esc(kind)}" data-b="${esc(k)}">Group with ${esc(E.BATCH_KINDS[k].label)}</button>`).join('')}
        </div>
      </div>
      <footer class="sheet-foot bk-foot">${act ? '<button data-act="batch-end">End batch</button>' : `<button class="primary" data-act="batch-start" data-key="${esc(b.key)}">Start</button>`}</footer>
    </div>`);
  }

  function screenBeds(p, n) {
    let beds = bedSummaries(p);
    if (ui.bedSort === 'ward') beds.sort((a, b) => natural(a.ward || '~', b.ward || '~') || natural(a.ref, b.ref));
    else if (ui.bedSort === 'urgent') beds.sort((a, b) => a.level - b.level || (b.overdue - a.overdue) || a.due - b.due || natural(a.ref, b.ref));
    else beds.sort((a, b) => natural(a.ref, b.ref));
    return `
      <div class="beds-tools">
        <div class="seg" role="group" aria-label="Sort beds">${[['bed', 'Bed'], ['ward', 'Ward'], ['urgent', 'Urgent']].map(([k, l]) => `<button class="${ui.bedSort === k ? 'on' : ''}" data-act="bed-sort" data-k="${k}">${l}</button>`).join('')}</div>
        <form class="add-line" data-form="add-bed"><label class="sr" for="add-bed">Add bed</label><input id="add-bed" name="v" placeholder="Add bed, e.g. 14" inputmode="text" autocomplete="off"><button>Add</button></form>
      </div>
      ${beds.length ? `<div class="rows">${beds.map((b) => `
        <button class="row bed-row" data-act="open-bed" data-bed="${esc(b.ref)}">
          <span class="row-bed">${esc(b.ref)}</span>
          <span class="row-title">${b.pending ? `${b.pending} pending` : '<span class="muted">No pending tasks</span>'}${b.waiting ? `<span class="muted"> · ${b.waiting} waiting</span>` : ''}${b.ward && ui.bedSort === 'ward' ? `<span class="muted"> · ${esc(b.ward)}</span>` : ''}</span>
          <span class="row-right">${b.question ? '<span class="qmark">?</span>' : ''}${b.level <= 2 ? priMark(b.level) : ''}${b.overdue ? '<span class="due over">late</span>' : b.due !== Infinity && b.due - n < 2 * E.HOUR ? `<span class="due soon">${E.fmtTime(b.due)}</span>` : ''}${ICON(IC.chev, 16)}</span>
        </button>`).join('')}</div>` : emptyNote('No beds yet. Add one above, or type a task with a bed, e.g. “bed 12 check FBC”.')}`;
  }

  function screenBed(p, n) {
    const ref = ui.bed;
    const m = assessments(p);
    const b = bedOf(ref) || { ref, encounter: null };
    const enc = b.encounter || { id: null, startedAt: 0 };
    const isCurrent = (t) => (t.encounterId ? t.encounterId === enc.id : (t.createdAt || 0) >= (enc.startedAt || 0) - E.MIN);
    const mine = S.tasks.filter((t) => t.patientRef === ref);
    const cur = mine.filter(isCurrent), prev = mine.filter((t) => !isCurrent(t));
    const open = cur.filter(E.isOpen);
    const rank = (x, y) => { const ia = m.get(x.id), ib = m.get(y.id); return (ia ? ia.a.level : 9) - (ib ? ib.a.level : 9) || (ib ? ib.a.score : 0) - (ia ? ia.a.score : 0); };
    const groups = Object.entries(E.GROUPS).map(([g, x]) => ({ g, x, list: open.filter((t) => t.group === g).sort(rank) })).filter((y) => y.list.length);
    const done = cur.filter((t) => !E.isOpen(t)).sort((x, y) => ((y.completion || y.cancelled || {}).at || 0) - ((x.completion || x.cancelled || {}).at || 0));
    const prevOpen = prev.filter(E.isOpen);
    const notes = (S.notes || []).filter((x) => x.patientRef === ref).sort((x, y) => y.createdAt - x.createdAt);
    const imgs = E.imagesForBed(S.images, b);
    const counts = { waiting: open.filter((t) => ['waiting', 'blocked'].includes(t.status)).length };
    const supported = imagesSupported();
    const thumbs = imgs.current.map((im) => `<button class="thumb" data-act="img-open" data-img="${im.id}" data-thumb="${im.id}"><img alt="${esc(im.title)}" src="${imgUrls.get('t:' + im.id) || ''}"><span class="thumb-cap"><b>${esc(im.title)}</b><span>${E.fmtWhen(im.createdAt, n)}</span></span></button>`).join('');
    if (imgKey && imgs.current.length) setTimeout(() => loadThumbs(imgs.current.map((x) => x.id)), 0);
    return `
      <div class="folder-head">
        <div><span class="fh-label">${b.encounter && b.encounter.label ? esc(b.encounter.label) : '<span class="muted">No patient label</span>'}</span>
        <span class="muted small">${enc.startedAt ? `this patient since ${E.fmtWhen(enc.startedAt, n)}` : ''}</span></div>
        <button class="mini" data-act="new-patient">New patient in this bed</button>
      </div>
      <div class="folder-tools">
        <div class="seg small" role="group" aria-label="Requested by">${[['', 'Self'], ['MO', 'MO'], ['Specialist', 'Specialist'], ['Nurse', 'Nurse']].map(([v, l]) => `<button class="${ui.from === v ? 'on' : ''}" data-act="set-from" data-v="${v}">${l}</button>`).join('')}</div>
        <button class="next-bed" data-act="next-bed">Next bed ${ICON(IC.chev, 16)}</button>
      </div>
      ${groups.length ? groups.map(({ g, x, list }) => `<section class="list"><h2 class="lh"><span class="cc g-${g}">${x.short}</span>${esc(x.label)} <span class="count">${list.length}</span></h2><div class="rows">${list.map((t) => row(t, m.get(t.id), n, { noBed: true, noCat: true })).join('')}</div></section>`).join('') : emptyNote('No open tasks for this patient.')}
      ${counts.waiting ? `<p class="hint">${counts.waiting} waiting or blocked — shown in their category with the reason.</p>` : ''}
      ${prevOpen.length ? `<section class="list warn-box"><h2 class="lh">Previous patient in ${esc(ref)} · still open <span class="count">${prevOpen.length}</span></h2><div class="rows">${prevOpen.map((t) => row(t, m.get(t.id), n, { noBed: true })).join('')}</div><p class="hint">These belong to an earlier stay in this bed. Finish, cancel or move them.</p></section>` : ''}
      <section class="list"><h2 class="lh">Images <span class="count">${imgs.current.length}</span>${supported && imgKey ? '<button class="linkish" data-act="img-lock">Lock</button>' : ''}</h2>
        <button class="wide" data-act="img-add">${ICON(IC.plus, 18)} Add image</button>
        ${!supported ? `<p class="hint">${IS_ARTIFACT ? 'Images work only in the installed phone app. This preview has no secure place to keep patient photos.' : 'This browser can’t store images securely, so image attachments are off.'}</p>`
          : imgs.current.length ? (imgKey ? `<div class="thumbs">${thumbs}</div>` : `<button class="img-locked" data-act="img-unlock">${ICON(IC.lock, 18)} ${imgs.current.length} image${imgs.current.length > 1 ? 's' : ''} — enter your image PIN to view</button>`) : ''}
        ${imgs.previous.length ? `<p class="hint">${imgs.previous.length} photo${imgs.previous.length > 1 ? 's' : ''} from a previous patient in this bed ${imgs.previous.length > 1 ? 'are' : 'is'} hidden. <button class="mini" data-act="img-del-prev">Delete ${imgs.previous.length > 1 ? 'them' : 'it'}</button></p>` : ''}
        ${supported && S.settings.imgRetentionDays > 0 && imgs.current.length ? `<p class="hint">Deleted automatically after ${S.settings.imgRetentionDays} days.</p>` : ''}
      </section>
      <section class="list"><h2 class="lh">Notes <span class="count">${notes.length}</span><button class="linkish" data-act="new-note">New note</button></h2>
        ${notes.length ? `<div class="rows">${notes.map((x) => `<button class="row" data-act="open-note" data-id="${x.id}"><span class="row-title">${ICON(IC.note, 16)} ${esc(x.transcript.slice(0, 60))}${x.transcript.length > 60 ? '…' : ''}</span><span class="row-right"><span class="st${x.status === 'draft' ? ' draft' : ' ok'}">${x.status}</span></span></button>`).join('')}</div>` : ''}
      </section>
      ${done.length ? `<details class="list fold"${ui.openSecs.has('bed-done') ? ' open' : ''} data-sec="bed-done"><summary class="lh">Done <span class="count">${done.length}</span></summary><div class="rows">${done.map((t) => row(t, null, n, { noBed: true })).join('')}</div></details>` : ''}
      <div class="folder-foot">
        <label class="ward-edit">Ward <input id="bed-ward" data-bed-ward="${esc(ref)}" value="${esc(b.ward || '')}" placeholder="e.g. 5B"></label>
        <label class="ward-edit">Patient label <input id="bed-label" data-bed-label="${esc(ref)}" value="${esc((b.encounter && b.encounter.label) || '')}" placeholder="approved code only"></label>
        <button class="ghost danger-text" data-act="clear-bed" ${open.length ? 'disabled' : ''}>${open.length ? 'Clear bed (finish open tasks first)' : 'Clear bed'}</button>
      </div>`;
  }

  function screenWaiting(p, n) {
    const due = p.waiting.filter((i) => i.state === 'followup');
    const waiting = p.waiting.filter((i) => i.state === 'waiting');
    const wrow = (it) => {
      const t = it.t;
      const unmet = (t.prereqs || []).filter((x) => !x.met);
      return `<div class="wrow">${row(t, it, n)}
        <div class="wbtns">
          ${unmet.length ? unmet.map((x) => x.kind === 'task' ? (task(x.taskId) && E.isOpen(task(x.taskId)) ? `<button data-act="open" data-id="${x.taskId}">Do first: ${esc(task(x.taskId).title)}</button>` : `<span class="muted small">after ${esc(x.text.replace(/ is done$/, ''))}</span>`) : `<button data-act="prereq-met" data-id="${t.id}" data-p="${x.id}">${esc(x.text)} ✓</button>`).join('') : `<button class="primary" data-act="outcome-in" data-id="${t.id}">Result in</button><button data-act="snooze" data-id="${t.id}" data-m="60">+1 h</button>`}
        </div></div>`;
    };
    if (!due.length && !waiting.length && !p.blocked.length) return emptyNote('Nothing waiting. When you send a test, referral or call, tap “Done, awaiting result” and it waits here.');
    return `
      ${due.length ? `<section class="list"><h2 class="lh">Re-check now <span class="count">${due.length}</span></h2>${due.map(wrow).join('')}</section>` : ''}
      ${waiting.length ? `<section class="list"><h2 class="lh">Waiting <span class="count">${waiting.length}</span></h2>${waiting.map(wrow).join('')}</section>` : ''}
      ${p.blocked.length ? `<section class="list"><h2 class="lh">Blocked <span class="count">${p.blocked.length}</span></h2>${p.blocked.map(wrow).join('')}</section>` : ''}`;
  }

  function screenHandover(p, n) {
    const h = E.buildHandover(S.tasks, n, S.settings);
    const v = S.handoverVerification;
    const verified = v && v.hash === h.hash;
    const stale = v && v.hash !== h.hash;
    const all = h.groups.flatMap((g) => g.items);
    const checked = all.filter((i) => ui.hoChecked.has(i.id)).length;
    const typeLabel = { unfinished: 'to do', result: 'result pending', referral: 'referral pending', blocked: 'blocked', waiting: 'waiting' };
    return `
      <div class="ho-head"><span>Handover ${E.fmtWhen(h.handoverAt, n)} · ${all.length} open</span><span class="vstate ${verified ? 'ok' : stale ? 'stale' : 'draft'}">${verified ? `Checked ${E.fmtTime(v.at)}` : stale ? 'Changed since checked' : 'Draft'}</span></div>
      ${all.length ? h.groups.map((g) => `<section class="ho-group"><h2 class="lh">${bedTag(g.patient === 'No patient given' ? null : g.patient) || '<span class="muted">No bed</span>'}</h2>${g.items.map((i) => `
        <label class="ho-item${i.emergency ? ' em' : ''}">
          <input type="checkbox" data-act-change="ho-check" data-id="${i.id}" ${ui.hoChecked.has(i.id) ? 'checked' : ''}>
          <span class="ho-body">
            <span class="ho-line">${priMark(i.priority)}<b>${esc(i.title)}</b> <span class="ho-type">${typeLabel[i.type]}</span>${i.deadlineLabel ? ` <span class="due">${esc(i.deadlineLabel)}</span>` : ''}</span>
            <span class="ho-next"><span class="gen">next</span> ${esc(i.next)}</span>
            <q class="ho-entered">${esc(i.entered)}</q>
          </span>
        </label>`).join('')}</section>`).join('') : emptyNote('Nothing open to hand over.')}
      <div class="ho-actions">
        <button class="primary" data-act="ho-verify" ${checked === all.length && all.length ? '' : 'disabled'}>${verified ? 'Checked ✓' : `Mark checked ${checked}/${all.length}`}</button>
        <button data-act="ho-copy">${ICON(IC.copy, 18)} Copy</button>
        <button class="ghost" data-act="ho-checkall">Tick all</button>
      </div>
      <p class="hint">Quotes are what you typed; “next” lines are app suggestions. Copied text says DRAFT until you mark it checked.</p>`;
  }

  function screenMore(p) {
    const drafts = (S.notes || []).filter((x) => x.status === 'draft').length;
    const items = [['tasks', 'All tasks', `${S.tasks.filter(E.isOpen).length} open`], ['schedule', 'Schedule', `${p.later.length} later`], ['done', 'Done', ''], ['notes', 'Clinical notes', drafts ? `${drafts} draft` : ''], ['recent', 'Recent entries', (S.captures || []).length ? `${(S.captures || []).length}` : ''], ['settings', 'Settings', S.settings.shiftConfirmed ? '' : 'set your shift']];
    return `<div class="rows">${items.map(([k, l, s]) => `<button class="row" data-act="go" data-tab="${k}"><span class="row-title">${l}</span><span class="row-right"><span class="muted">${s}</span>${ICON(IC.chev, 16)}</span></button>`).join('')}</div>
      <p class="hint">${storageOK ? 'Tasks are saved on this phone only.' : 'Storage is blocked — nothing is being saved.'} ${IS_ARTIFACT ? '' : ui.swState === 'active' ? 'Works offline.' : ''} v${APP_VERSION}</p>`;
  }

  function groupKey(t, it, g, n) {
    switch (g) {
      case 'patient': return t.patientRef || 'No bed';
      case 'category': return catLabel(t);
      case 'group': return `${Object.keys(E.GROUPS).indexOf(t.group) + 1} · ${(E.GROUPS[t.group] || E.GROUPS.rounds).label}`;
      case 'priority': return it ? `P${it.a.level} · ${PRI_NAME[it.a.level]}` : 'Closed';
      case 'status': return E.STATUSES[t.status];
      case 'team': return t.team || t.assignedBy || 'No team / person';
      case 'ward': return t.ward || 'No ward';
      case 'shift': return E.shiftKeyLabel(t.shiftKey);
      case 'pending': return E.isOpen(t) ? 'Pending' : 'Completed / cancelled';
      case 'deadline': {
        if (!t.deadline) return '6 · No deadline';
        const d = (t.deadline - n) / E.MIN;
        if (d < 0) return '1 · Overdue';
        if (d <= 60) return '2 · Next hour';
        if (E.dayStart(t.deadline) === E.dayStart(n)) return '3 · Today';
        if (E.dayStart(t.deadline) === E.dayStart(n) + E.DAY) return '4 · Tomorrow';
        return '5 · Later';
      }
      default: return '';
    }
  }
  function screenTasks(p, n) {
    const m = assessments(p);
    const q = ui.search.trim().toLowerCase();
    const f = ui.filter;
    const list = S.tasks.filter((t) => {
      if (f === 'active' && !E.isOpen(t)) return false;
      if (f === 'inbox' && !(E.isOpen(t) && blockingQ(t))) return false;
      if (f === 'waiting' && !['waiting', 'blocked'].includes(t.status)) return false;
      if (f === 'done' && t.status !== 'completed') return false;
      if (f === 'cancelled' && t.status !== 'cancelled') return false;
      if (ui.fCat && t.group !== ui.fCat) return false;
      if (ui.fBed && (t.patientRef || '') !== ui.fBed) return false;
      if (ui.fPri) { const it = m.get(t.id); const lv = it ? it.a.level : (E.isOpen(t) ? E.assess(t, { now: n, settings: S.settings }).level : 0); if (lv !== ui.fPri) return false; }
      if (!q) return true;
      const hay = [t.title, t.segment, t.input, catLabel(t), E.STATUSES[t.status], t.patientRef, t.team, t.assignedBy, t.ward, t.nextAction, t.waitReason].join(' ').toLowerCase();
      return q.split(/\s+/).every((w) => hay.includes(w));
    }).sort((a, b) => {
      const ia = m.get(a.id), ib = m.get(b.id);
      if (ia && ib) return ia.a.level - ib.a.level || ib.a.score - ia.a.score;
      if (ia) return -1; if (ib) return 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    const filters = [['active', 'Active'], ['inbox', 'Needs detail'], ['waiting', 'Waiting'], ['done', 'Done'], ['cancelled', 'Cancelled'], ['all', 'All']];
    let body;
    if (!list.length) body = emptyNote(q ? `No tasks match “${esc(ui.search)}”.` : 'No tasks here.');
    else if (ui.groupBy === 'none') body = `<div class="rows">${list.map((t) => row(t, m.get(t.id), n)).join('')}</div>`;
    else {
      const groups = new Map();
      for (const t of list) { const k = groupKey(t, m.get(t.id), ui.groupBy, n); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
      body = [...groups.keys()].sort(natural).map((k) => `<section class="list"><h2 class="lh">${esc(k.replace(/^\d · /, ''))} <span class="count">${groups.get(k).length}</span></h2><div class="rows">${groups.get(k).map((t) => row(t, m.get(t.id), n)).join('')}</div></section>`).join('');
    }
    return `
      <div class="toolbar">
        <label class="search"><span class="sr">Search tasks</span>${ICON(IC.search, 18)}<input id="search-input" type="search" placeholder="Search bed, test, team…" value="${esc(ui.search)}" data-bind="search" autocomplete="off"></label>
        <div class="chips scroll">${filters.map(([id, l]) => `<button class="chip${ui.filter === id ? ' on' : ''}" data-act="filter" data-f="${id}">${l}</button>`).join('')}</div>
        <div class="chips scroll" role="group" aria-label="Category">${[['', 'All categories'], ...Object.entries(E.GROUPS).map(([g, x]) => [g, x.short])].map(([g, l]) => `<button class="chip${ui.fCat === g ? ' on' : ''}${g ? ' g-' + g : ''}" data-act="fcat" data-g="${g}" title="${g ? esc(E.GROUPS[g].label) : ''}">${esc(l)}</button>`).join('')}</div>
        <div class="filter-row">
          <div class="chips" role="group" aria-label="Priority">${[0, 1, 2, 3, 4].map((l) => `<button class="chip${ui.fPri === l ? ' on' : ''}" data-act="fpri" data-l="${l}">${l ? 'P' + l : 'Any P'}</button>`).join('')}</div>
          <label class="groupby">Bed <select id="fbed" data-bind="fBed"><option value="">All</option>${[...new Set(S.tasks.map((t) => t.patientRef).filter(Boolean))].sort(natural).map((b) => `<option value="${esc(b)}"${ui.fBed === b ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
        </div>
        <label class="groupby">Group <select id="groupby" data-bind="groupBy">${[['none', 'Ranked'], ['group', 'Category'], ['patient', 'Bed'], ['priority', 'Priority'], ['category', 'Task type'], ['status', 'Status'], ['deadline', 'Deadline'], ['team', 'Team / person'], ['ward', 'Ward'], ['shift', 'Shift'], ['pending', 'Pending vs done']].map(([v, l]) => `<option value="${v}"${ui.groupBy === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      ${body}`;
  }

  function screenSchedule(p, n) {
    const w = p.shift.state === 'on' ? p.shift : p.nextShift;
    const events = [];
    for (const t of S.tasks.filter(E.isOpen)) {
      if (t.deadline) events.push({ at: t.deadline, kind: 'due', t });
      if (t.notBefore && t.notBefore > n) events.push({ at: t.notBefore, kind: 'from', t });
      if (t.followUpAt) events.push({ at: t.followUpAt, kind: 're-check', t });
      for (const r of t.reminders || []) if (r.kind === 'manual' && !r.firedAt) events.push({ at: r.at, kind: 'reminder', t });
    }
    events.sort((a, b) => a.at - b.at);
    const inShift = events.filter((e) => e.at < w.end);
    const later = events.filter((e) => e.at >= w.end);
    const hours = [];
    for (let h = w.start; h < w.end; h += E.HOUR) hours.push(h);
    const before = inShift.filter((e) => e.at < w.start);
    const ev = (e) => `<button class="ev" data-act="open" data-id="${e.t.id}"><span class="ev-time">${E.fmtTime(e.at)}</span><span class="ev-kind k-${e.kind.replace(/\W/g, '')}">${e.kind}</span>${bedTag(e.t.patientRef)}<span class="ev-title">${esc(e.t.title)}</span></button>`;
    const byDay = new Map();
    for (const e of later) { const k = E.fmtDay(e.at, n); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); }
    return `
      ${before.length ? `<section class="timeline"><div class="hour past"><span class="h">Earlier</span><div>${before.map(ev).join('')}</div></div></section>` : ''}
      <section class="timeline">${hours.map((h) => {
        const evs = inShift.filter((e) => e.at >= h && e.at < h + E.HOUR);
        const isNow = n >= h && n < h + E.HOUR;
        const ho = w.handover >= h && w.handover < h + E.HOUR;
        return `<div class="hour${h + E.HOUR <= n ? ' past' : ''}${isNow ? ' now' : ''}"><span class="h">${E.fmtTime(h)}</span><div>${isNow ? `<span class="nowline">now ${E.fmtTime(n)}</span>` : ''}${evs.map(ev).join('')}${ho ? `<span class="homark">handover ${E.fmtTime(w.handover)}</span>` : ''}</div></div>`;
      }).join('')}</section>
      ${[...byDay.entries()].map(([k, list]) => `<section class="list"><h2 class="lh">${esc(k)} <span class="count">${list.length}</span></h2><div class="evs">${list.map(ev).join('')}</div></section>`).join('')}`;
  }

  function screenDone(p, n) {
    const done = S.tasks.filter((t) => t.status === 'completed').sort((a, b) => b.completion.at - a.completion.at);
    const cancelled = S.tasks.filter((t) => t.status === 'cancelled');
    const shiftStart = p.shift.state === 'on' ? p.shift.start : E.dayStart(n);
    const thisShift = done.filter((t) => t.completion.at >= shiftStart);
    const earlier = done.filter((t) => t.completion.at < shiftStart);
    const dr = (t) => `<div class="done-row">${row(t, null, n)}<span class="muted small">${E.fmtWhen((t.completion || t.cancelled || {}).at || t.updatedAt, n)}</span><button class="mini" data-act="reopen" data-id="${t.id}">Reopen</button></div>`;
    return `
      <p class="hint">Done means you ticked it. The app cannot check clinical outcomes.</p>
      <section class="list"><h2 class="lh">This shift <span class="count">${thisShift.length}</span></h2>${thisShift.length ? thisShift.map(dr).join('') : emptyNote('Nothing done yet this shift.')}</section>
      ${earlier.length ? `<section class="list"><h2 class="lh">Earlier <span class="count">${earlier.length}</span></h2>${(ui.showAllDone ? earlier : earlier.slice(0, 15)).map(dr).join('')}${earlier.length > 15 && !ui.showAllDone ? '<button class="linkish" data-act="show-all-done">Show all</button>' : ''}</section>` : ''}
      ${cancelled.length ? `<section class="list"><h2 class="lh">Cancelled <span class="count">${cancelled.length}</span></h2>${cancelled.map(dr).join('')}</section>` : ''}`;
  }

  function screenNotes() {
    const notes = (S.notes || []).slice().sort((a, b) => b.createdAt - a.createdAt);
    const n = now();
    return `<p class="hint">Dictated or typed clinical notes. Stored only on this phone. They stay drafts until you confirm them, and never create tasks by themselves.</p>
      <button class="wide" data-act="new-note">${ICON(IC.plus, 18)} New note</button>
      ${notes.length ? `<div class="rows">${notes.map((x) => `<button class="row" data-act="open-note" data-id="${x.id}"><span class="row-bed">${esc(x.patientRef || '')}</span><span class="row-title">${esc(x.transcript.slice(0, 70))}${x.transcript.length > 70 ? '…' : ''}</span><span class="row-right"><span class="st${x.status === 'draft' ? ' draft' : ' ok'}">${x.status}</span><span class="muted small">${E.fmtWhen(x.createdAt, n)}</span></span></button>`).join('')}</div>` : emptyNote('No notes yet. Hold the mic and choose “Clinical note”, or tap New note.')}`;
  }

  function screenRecent() {
    const n = now();
    const list = (S.captures || []).slice().reverse();
    return `<p class="hint">What you typed or dictated, newest first, with what the app made from it. Kept on this phone (last 50).</p>
      ${list.length ? `<div class="rows">${list.map((c) => {
        const made = c.taskIds.map(task).filter(Boolean);
        const live = made.filter((t) => t.status !== 'cancelled').length;
        const first = c.input.replace(/\s+/g, ' ').slice(0, 80);
        return `<button class="row" data-act="compare" data-cap="${c.id}"><span class="row-title">${esc(first)}${c.input.length > 80 ? '…' : ''}</span><span class="row-right">${c.failed ? '<span class="st">not read</span>' : `<span class="muted small">${live} task${live === 1 ? '' : 's'}</span>`}<span class="muted small">${E.fmtWhen(c.at, n)}</span></span></button>`;
      }).join('')}</div>` : emptyNote('Nothing yet.')}`;
  }

  function screenSettings() {
    const s = S.settings;
    const real = S.tasks.filter((t) => !t.isDemo).length, demo = S.tasks.length - real;
    const opt = (v, l, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`;
    const perm = notifPermission();
    const mt = S.metrics || {};
    const avg = mt.captureMsCount ? Math.round(mt.captureMsTotal / mt.captureMsCount / 1000) : null;
    const wfs = Object.entries(s.workflows || {});
    return `
      <form class="settings" data-form="settings" autocomplete="off">
        <section class="set-group"><h2>Shift & ward</h2>
          <div class="grid2">
            <label>Shift type<select name="shiftType">${Object.entries(E.SHIFT_TYPES).map(([v, l]) => opt(v, l, s.shiftType)).join('')}</select></label>
            <label>Ward<input name="ward" value="${esc(s.ward)}" placeholder="e.g. 5B"></label>
            <label>Starts<input type="time" name="shiftStart" value="${esc(s.shiftStart)}" required></label>
            <label>Ends<input type="time" name="shiftEnd" value="${esc(s.shiftEnd)}" required></label>
            <label>Handover<input type="time" name="handoverTime" value="${esc(s.handoverTime)}" required></label>
            <label>Rounds usually end<input type="time" name="roundsEnd" value="${esc(s.roundsEnd)}"></label>
            <label>Hospital<input name="hospital" value="${esc(s.hospital)}"></label>
            <label>Department<input name="department" value="${esc(s.department)}"></label>
            <label>Rotation<input name="rotation" value="${esc(s.rotation)}"></label>
          </div>
          <p class="hint">${s.shiftConfirmed ? 'Malaysia time (UTC+8).' : 'Using 07:00–17:00 until you save.'} For overnight shifts, set an end earlier than the start.</p>
        </section>
        <section class="set-group"><h2>Referral specialties</h2>
          <label>One per line. Add “| how to refer” if you know your hospital’s channel.<textarea name="referralTeams" rows="5" placeholder="Cardiology | e-referral, then call MO on call">${esc(s.referralTeams || '')}</textarea></label>
          <p class="hint">These are the options offered when a referral has no specialty. Channels show only what you entered here.</p>
        </section>
        <section class="set-group" id="vocab-sec"><h2>Your shorthand</h2>
          <label>One per line, like “HBN = repeat Hb”. Used only on this phone, to read your entries.<textarea id="vocab-box" name="vocab" rows="4" placeholder="HBN = repeat Hb&#10;OGDS = book OGDS">${esc(ui.vocabDraft != null ? ui.vocabDraft : s.vocab || '')}</textarea></label>
          ${ui.vocabDraft != null ? '<p class="hint warnline">Not saved yet — check the new line, then Save settings.</p>' : ''}
          <p class="hint">No names or identifiers. Shorthand the app already reads (recognition aids only, not KKM rules):</p>
          ${Object.entries(E.VOCAB).map(([cat, rows]) => `<details class="vocab"><summary>${esc(cat)}</summary><dl>${rows.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></details>`).join('')}
        </section>
        <section class="set-group"><h2>Batching</h2>
          <label class="check"><input type="checkbox" name="batching" ${s.batching !== false ? 'checked' : ''}> Suggest batches of similar routine work</label>
          <label class="check"><input type="checkbox" name="groupByWard" ${s.groupByWard !== false ? 'checked' : ''}> Group bedside work by ward (when wards are set)</label>
          <label class="check"><input type="checkbox" name="learnTimes" ${s.learnTimes ? 'checked' : ''}> Learn typical times from batches I finish (minutes only, kept on this phone)</label>
          <p class="hint">Typical minutes per task, used for estimates. Leave blank for the app’s rough default.</p>
          <div class="grid2">${[['referral', 'Referral'], ['bloods', 'Blood taking'], ['results', 'Result check'], ['docs', 'Documentation'], ['mo_update', 'MO update item'], ['meds', 'Drug chart']].map(([k, l]) => `<label>${l}<input type="number" min="1" max="120" name="bm_${k}" value="${esc((s.batchMins || {})[k] || '')}" placeholder="auto"></label>`).join('')}</div>
          <p class="hint">Urgent, overdue, unclear or emergency tasks are never put in a batch.</p>

  /** Mark each task's source words in the original entry (first match, in order). */
  function highlightInput(input, made) {
    const lower = input.toLowerCase();
    const ranges = [];
    let cursor = 0;
    made.forEach((t, i) => {
      const src = String(t.segmentOrig || '').trim();
      if (!src) return;
      const needle = src.toLowerCase();
      let at = lower.indexOf(needle, cursor);
      if (at < 0) at = lower.indexOf(needle);
      if (at < 0 || ranges.some((r) => at < r.end && r.start < at + needle.length)) return;
      ranges.push({ start: at, end: at + needle.length, n: i });
      cursor = at + needle.length;
    });

  function onChange(e) {
    const el = e.target;
    if (el.dataset.field) { fieldChange(el); return; }
    if (el.dataset.sub) {
      const t = task(el.dataset.id);
      if (!t) return;
      E.updateTask(S, t.id, { subtasks: t.subtasks.map((x) => (x.id === el.dataset.sub ? { ...x, text: el.value.trim() || x.text } : x)) }, now()); softCommit(); return;
    }
    if (el.dataset.note) { const nt = note(el.dataset.note); if (nt) { nt.draft = el.value; nt.updatedAt = now(); save(); } return; }
    if (el.dataset.noteBed !== undefined && el.dataset.noteBed) { const nt = note(el.dataset.noteBed); if (nt) { const v = el.value.trim(); const pr = v && E.extractPatient(v); nt.patientRef = pr && pr.index === 0 ? pr.ref : v || null; touchBed(nt.patientRef, now()); commit(); } return; }
    if (el.dataset.bedLabel) {
      const b = bedOf(el.dataset.bedLabel);
      const v = el.value.trim();
      if (v && E.scanPrivacy(v).length) { toast('That looks like a name or ID number. Use only an approved code (e.g. your ward’s encounter number), or leave it blank.', 'warn', 7000); el.value = (b && b.encounter && b.encounter.label) || ''; return; }
      if (b) { E.ensureEncounter(b, now()); b.encounter.label = v.slice(0, 30); save(); }
      return;
    }
    if (el.id === 'img-cam' || el.id === 'img-pick') {
      const f = el.files && el.files[0];

      el.value = '';

      return;
    }
    if (el.dataset.imgBed) { if (ui.imgDraft) { ui.imgDraft.bedRef = el.value; ensureBed(el.value); renderMenu(); } return; }
    if (el.dataset.bedWard) { const b = (S.beds || []).find((x) => x.ref === el.dataset.bedWard); if (b) { b.ward = el.value.trim(); save(); } else { touchBed(el.dataset.bedWard, now()); S.beds.find((x) => x.ref === el.dataset.bedWard).ward = el.value.trim(); save(); } return; }
    const act = el.dataset.actChange;
    if (act === 'sub-toggle') {
      const t = task(el.dataset.id);
      E.updateTask(S, t.id, { subtasks: t.subtasks.map((x) => (x.id === el.dataset.s ? { ...x, done: el.checked } : x)) }, now());
      commit(); return;

    if (el.id === 'restore-file' && el.files && el.files[0]) {

  function onSubmit(e) {
    const form = e.target;
    e.preventDefault();
    const n = now();
    const kind = form.dataset.form || form.id;
    const v = form.elements.v ? form.elements.v.value : '';
    const id = form.dataset.id;
    switch (kind) {
      case 'capture': {
        const text = $('#capture-input').value;
        const vm = ui.voiceMeta;
        const voice = vm && text.trim() === vm.transcript.trim() ? { alts: vm.alts, conf: vm.conf } : null;
        capture(text, { from: ui.tab === 'bed' ? ui.from || null : null, voice });
        setTimeout(() => { const ci = $('#capture-input'); if (ci && document.activeElement !== ci && (ui.tab === 'bed')) ci.focus(); }, 30);
        break;
      }
      case 'img-setpin': {
        const pin = form.elements.pin.value.trim(), pin2 = form.elements.pin2.value.trim();
        if (!/^\d{4,12}$/.test(pin)) { toast('Use 4–12 digits.', 'warn'); break; }
        if (pin !== pin2) { toast('The two PINs don’t match.', 'warn'); break; }
        const next = ui.menu && ui.menu.next;
        setImagePin(pin).then(() => { toast('Image PIN set'); continueImage(next); }).catch(() => toast('Couldn’t set up encryption on this phone.', 'warn'));
        break;

        const pin = form.elements.pin.value.trim();

        break;
      }
